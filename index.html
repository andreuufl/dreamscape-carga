<style>
:root{--navy:#16243a;--navy2:#22344f;--bg:#f2f4f7;--card:#fff;--txt:#14202e;--mut:#6b7686;--line:#e3e7ec;--ok:#1f9d55;--okbg:#e5f6ec;--dev:#2b6cb0;--devbg:#e6f0fa;--warn:#d97706;--warnbg:#fff4e0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0}
.sub{font-size:13px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:22px;flex:none}

.search{margin-top:12px;width:100%;padding:12px 14px;border-radius:12px;border:0;font:inherit;font-size:16px;background:#fff}
.seg{display:flex;background:var(--navy2);border-radius:12px;padding:4px;margin-top:12px}

.seg button.on{background:#fff;color:var(--navy)}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}

.sheet{max-height:88vh;overflow:auto}
.scan{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;background:var(--card);border:1.5px dashed #b9c3d0;font-weight:700;font-size:15px;margin-bottom:12px;color:var(--navy)}
.scan .ic{font-size:20px}

.scanov video{width:100%;height:100%;object-fit:cover}

.scantop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;color:#fff}

.scanlast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);background:rgba(20,32,46,.92);color:#fff;padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:16px}
.scanlast.good{background:var(--ok)}.scanlast.bad{background:#c0392b}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px}
.contact .lbl{font-size:12px;color:var(--mut);font-weight:600}
.call{flex:none;background:var(--ok);color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:12px}
.hito{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);margin-bottom:10px;text-align:left}
.hito .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.hito b{display:block;font-size:17px}.hito small{color:var(--mut);font-size:13px}
.hito.ok .ic{background:var(--ok);color:#fff;font-weight:900}
.salida.firma{background:var(--navy)}
.pad{position:relative;height:190px;border:1.5px dashed #b9c3d0;border-radius:14px;background:#fff;margin-bottom:4px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:14px;touch-action:none}
.padhint{position:absolute;inset:0;display:grid;place-items:center;color:#a0aab8;pointer-events:none;font-weight:600}
.selfurgo{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--txt)}
.frow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.plate.sm{font-size:15px;margin-bottom:4px}
.danger{color:#c0392b!important}
.fotobtn{display:block;text-align:center;margin-top:10px}
.prev{width:100%;border-radius:12px;display:block;max-height:260px;object-fit:cover}
.card.alerta{background:var(--warnbg);color:var(--warn);border:1.5px solid #f3c98b}
.card.alerta .meta{color:#9a5b06}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.label{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;break-inside:avoid;color:#14202e}
.label .qr{width:64px;height:64px;flex:none}.label .qr svg{width:100%;height:100%}

.label span{font-family:Fraunces,Georgia,serif;letter-spacing:.2em;font-size:8px;color:#a8844a}
@media (max-width:520px){ .step:not(.on) .t{display:none} .step{padding:8px} }
@media print{ .noprint,.toast,.foot{display:none!important} body{background:#fff} main.etiq{padding:0} .labels{grid-template-columns:repeat(3,1fr)} .sec{margin-top:8px} }
.redbar{position:fixed;left:0;right:0;top:0;z-index:40;background:#b45309;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px max(24px,env(safe-area-inset-left));background:var(--navy);color:#fff}

.mitem{width:100%;display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.mitem .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}

.pasos{padding-left:20px;line-height:1.6}.sel{user-select:all;-webkit-user-select:all;font-family:ui-monospace,Menlo,monospace}
.hoy{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}

.mapbtn.avisa{width:100%;margin-bottom:12px;text-align:left}
.btn.wa{background:#25d366;color:#fff;text-align:center;text-decoration:none;display:block}
a.btn{display:block;text-align:center;text-decoration:none}

.ck small{display:block;color:var(--mut);font-size:12px}
.grow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gimp{text-align:right;font-size:13px;color:var(--mut);display:flex;flex-direction:column}.gimp b{color:var(--txt);font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.fgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}

.bt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bt div{height:100%;background:var(--dev);border-radius:6px}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--navy2);border-radius:12px;padding:4px}

.sw{padding:8px 12px;border-radius:20px;background:var(--bg);font-weight:700;font-size:13px;color:var(--mut)}

<script>
// La clave llega en el enlace (#k=...) y se guarda en este móvil
let KEY = '';
try{ const m = location.hash.match(/k=([\w-]+)/); if(m){ localStorage.setItem('ck_key', m[1]); history.replaceState(null,'',location.pathname); } KEY = localStorage.getItem('ck_key') || ''; }catch(e){ const m = location.hash.match(/k=([\w-]+)/); KEY = m ? m[1] : ''; }
const S = { vista:'lista', filtro:'prox', q:'', presus:[], num:null, items:[], opciones:[], modo:'carga', pend:0, furgos:[], bolo:null, pendientes:[], catalogo:null, enviando:false };
let SALIDAS = {}; try{ SALIDAS = JSON.parse(localStorage.getItem('ck_salidas')||'{}'); }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib = n => { try{ navigator.vibrate && navigator.vibrate(n) }catch(e){} };

const API = 'https://script.google.com/macros/s/AKfycbwEQlNLMpsPbUDbgc3p12dKbyeVm17cIY_-XH3YmIzadhPqSUu12ZoHwxZ4xAfff45-/exec';
async function call(fn, ...args){
  S.pend++; dot();
  try{
    const u = API + '?k=' + encodeURIComponent(KEY) + '&a=' + fn + '&p=' + encodeURIComponent(JSON.stringify(args)) + '&t=' + Date.now();
    let j;
    try{ const r = await fetch(u, { credentials: 'omit', cache: 'no-store' }); j = await r.json(); }
    catch(e){ const ck = LECT.includes(fn) ? cacheGet(fn+JSON.stringify(args)) : undefined; if(ck !== undefined){ S.offline = true; pintarRed(); return ck; } const er = new Error('Sin conexión'); er.red = true; throw er; }
    if(!j.ok) throw new Error(j.e || 'Error');
    if(LECT.includes(fn)) cacheSet(fn+JSON.stringify(args), j.r);
    if(S.offline){ S.offline = false; pintarRed(); }
    return j.r;
  }finally{ S.pend--; dot(); }
}
async function callPost(fn, ...args){
  S.pend++; dot();
  try{
    let j;
    try{ const r = await fetch(API, { method:'POST', body: JSON.stringify({ k:KEY, a:fn, p:args }), credentials:'omit' }); j = await r.json(); }
    catch(e){ const er = new Error('Sin conexión'); er.red = true; throw er; }
    if(!j.ok) throw new Error(j.e || 'Error');
    return j.r;
  }
  finally{ S.pend--; dot(); }
}

async function abrir(num, refresco){
  const nuevo = !refresco; S.vista='det'; S.num=num; if(nuevo){ const cm = cacheGet('ckMaterial'+JSON.stringify([num])); S.items = cm ? cm.items : []; S.opciones = cm ? cm.opciones : []; S.bolo = cacheGet('ckBolo'+JSON.stringify([num])) || null; S.gastos = cacheGet('ckGastos'+JSON.stringify([num])) || []; S.fotos = null; }
  const p = S.presus.find(x=>x.num===num);
  if(nuevo){
    const f = (S.bolo||{}).ficha || {};
    S.modo = !p || !p.total || p.cargados<p.total ? 'carga' : (p.devueltos>0 ? 'dev' : 'ruta');
  }
  if(nuevo){ try{history.pushState({v:'det'},'')}catch(e){} render(); window.scrollTo(0,0); }
  if(COLA.length){ await vaciarCola(); }
  const [rm, rb, rg] = await Promise.allSettled([call('ckMaterial', num), call('ckBolo', num), call('ckGastos', num)]);
  if(rg.status==='fulfilled') S.gastos = rg.value || [];
  if(rm.status==='fulfilled'){ if(!COLA.length){ S.items=rm.value.items; S.opciones=rm.value.opciones; } actualizarResumen(); } else if(!S.items.length) toast('Error: '+rm.reason.message);
  if(rb.status==='fulfilled'){
    S.bolo = rb.value; S.furgos = rb.value.furgonetas || [];
    const f = S.bolo.ficha||{};
    if(nuevo && S.modo==='ruta' && (f.llegada || SALIDAS[num])) S.modo='montaje';
  }
  if(S.vista==='det' && S.num===num) render();
}

function fotoElegida(inp){
  const file = inp.files && inp.files[0]; if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 1280, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

let SCAN = null, SCANMODO = 'carga';
function cargarScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function abrirScan(modoScan){
  SCANMODO = modoScan || S.modo;
  const ov = document.createElement('div'); ov.className='scanov'; ov.id='scanov';
  ov.innerHTML = `<video id="scanv" playsinline muted></video><div class="scanframe"></div>
    <div class="scantop"><b>${SCANMODO==='consulta'?'Consultar equipo':SCANMODO==='carga'?'Cargar escaneando':'Devolver escaneando'}</b><button onclick="cerrarScan()">Cerrar</button></div>
    <div class="scanlast" id="scanlast">Apunta al código QR de la etiqueta</div>`;
  document.body.appendChild(ov);
  try{
    await cargarScript('jsqr.js');
    const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    const v = $('#scanv'); v.srcObject = st; await v.play();
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently:true });
    SCAN = { st, ultimo:'', t:0, on:true };
    const loop = () => {
      if(!SCAN || !SCAN.on) return;
      if(v.readyState === v.HAVE_ENOUGH_DATA){
        const w = 480, h = Math.round(v.videoHeight * w / v.videoWidth); c.width = w; c.height = h;
        x.drawImage(v, 0, 0, w, h);
        const r = jsQR(x.getImageData(0,0,w,h).data, w, h, { inversionAttempts:'dontInvert' });
        if(r && r.data && (r.data !== SCAN.ultimo || Date.now()-SCAN.t > 2500)){ SCAN.ultimo = r.data; SCAN.t = Date.now(); leido(r.data); }
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ $('#scanlast').textContent = 'No se pudo abrir la cámara. Permite el acceso a la cámara en Safari.'; }
}
function cerrarScan(){ if(SCAN){ SCAN.on=false; try{ SCAN.st.getTracks().forEach(t=>t.stop()); }catch(e){} SCAN=null; } const o=$('#scanov'); if(o) o.remove(); if(SCANMODO!=='consulta') render(); }
function leido(txt){
  const p = String(txt).split('|'), cod = (p[0]==='DS' ? p[1] : '') || '', nom = (p[0]==='DS' ? p[2] : txt) || '';
  if(SCANMODO==='consulta'){ cerrarScan(); verHistorial(nom, cod); return; }
  const U = s => String(s||'').trim().toUpperCase();
  const it = S.items.find(i => U(i.material)===U(nom) || (cod && (U(i.material).includes('('+U(cod)+')') || U(i.material)===U(cod))));
  const el = $('#scanlast') || {};
  if(!it){ el.className='scanlast bad'; el.textContent = '✕ ' + (nom||txt) + ' no está en este presupuesto'; vib([60,60,60]); return; }
  const k = S.modo==='carga' ? 'cargado' : 'devuelto';
  if(it[k]){ el.className='scanlast'; el.textContent = '✓ ' + it.material + ' ya estaba marcado'; return; }
  el.className='scanlast good'; el.textContent = '✓ ' + it.cant + ' × ' + it.material; vib(40);
  toggle(it.fila, true);
}

/* =========================================================
   SIN COBERTURA: caché de lecturas y cola de cambios
   ========================================================= */
const LECT = ['ckPresupuestos','ckMaterial','ckBolo','ckYo','ckFurgonetas','ckGastos','ckPendientes'];
function cacheGet(k){ try{ const v = localStorage.getItem('ck_c_'+k); return v ? JSON.parse(v) : undefined; }catch(e){ return undefined; } }
function cacheSet(k, v){ try{ localStorage.setItem('ck_c_'+k, JSON.stringify(v)); }catch(e){ limpiarCache(); } }
function limpiarCache(){ try{ Object.keys(localStorage).filter(k=>k.indexOf('ck_c_ckMaterial')===0||k.indexOf('ck_c_ckBolo')===0).slice(0,-6).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
let COLA = []; try{ COLA = JSON.parse(localStorage.getItem('ck_cola')||'[]'); }catch(e){}
function guardarCola(){ try{ localStorage.setItem('ck_cola', JSON.stringify(COLA)); }catch(e){ toast('Memoria llena: no se pudo guardar el cambio sin conexión'); } pintarRed(); }
async function enviar(fn, ...args){
  const post = ['ckSalida','ckFirma','ckFoto','ckGasto'].includes(fn);
  if(COLA.length){ COLA.push({fn, args, post}); guardarCola(); vaciarCola(); return null; }
  try{ return post ? await callPost(fn, ...args) : await call(fn, ...args); }
  catch(e){
    if(!e.red) throw e;
    COLA.push({fn, args, post}); guardarCola(); S.offline = true;
    toast('Sin cobertura: se enviará solo al volver la conexión');
    return null;
  }
}
let vaciando = false;
async function vaciarCola(){
  if(vaciando || !COLA.length || !navigator.onLine && navigator.onLine !== undefined && false) return;
  vaciando = true;
  try{
    while(COLA.length){
      const t = COLA[0];
      try{ t.post ? await callPost(t.fn, ...t.args) : await call(t.fn, ...t.args); }
      catch(e){ if(e.red){ S.offline = true; break; } toast('Un cambio no se pudo guardar: '+e.message); }
      COLA.shift(); guardarCola();
    }
    if(!COLA.length){ if(S.offline) toast('Conexión recuperada: todo guardado'); S.offline = false; }
  } finally { vaciando = false; pintarRed(); }
}
function pintarRed(){
  let b = $('#redbar');
  const txt = COLA.length ? `Sin conexión · ${COLA.length} cambio${COLA.length>1?'s':''} pendiente${COLA.length>1?'s':''} de enviar` : (S.offline ? 'Sin conexión · mostrando los últimos datos guardados' : '');
  if(!txt){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement('div'); b.id='redbar'; b.className='redbar'; b.onclick = vaciarCola; document.body.appendChild(b); }
  b.textContent = txt;
}
window.addEventListener('online', ()=>{ S.offline=false; vaciarCola(); });
setInterval(()=>{ if(COLA.length) vaciarCola(); }, 20000);
function guardarMatCache(){ if(S.num) cacheSet('ckMaterial'+JSON.stringify([S.num]), { items:S.items, opciones:S.opciones }); }
function guardarBoloCache(){ if(S.num && S.bolo) cacheSet('ckBolo'+JSON.stringify([S.num]), S.bolo); }

function diaDe(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function tarjetasHoy(){
  const hoy = diaDe(Date.now()), man = hoy + 864e5;
  const l = (S.presus||[]).filter(p => p.ts && (diaDe(p.ts) === hoy || diaDe(p.ts) === man) && !p.cerrado);
  if(!l.length) return '';
  return l.map(p => {
    const esHoy = diaDe(p.ts) === hoy;
    const paso = p.cargados < p.total ? 'Empezar a cargar' : p.devueltos === 0 ? 'Ir al evento' : 'Terminar la vuelta';
    return `<div class="hoy ${esHoy?'':'man'}"><div class="lbl">${esHoy?'HOY':'MAÑANA'} · ${esc(p.montaje)}</div><div class="hev">${esc(p.evento)}</div>
      ${p.lugar?`<div class="hlug">📍 ${esc(p.lugar)}</div>`:''}
      <div class="hst"><span>🚚 ${p.cargados}/${p.total}</span><span>🏠 ${p.devueltos}/${p.total}</span>${(p.tecnicos||[]).length?`<span>👤 ${esc(p.tecnicos.join(', '))}</span>`:''}</div>
      <button class="btn" onclick="abrir('${esc(p.num)}')">${paso} →</button></div>`;
  }).join('');
}

function duracion(a, b){
  const p = s => { const m = String(s||'').match(/(\d+)\/(\d+) (\d+):(\d+)/); return m ? new Date(new Date().getFullYear(), m[2]-1, m[1], m[3], m[4]).getTime() : null; };
  const x = p(a), y = p(b); return x && y && y > x ? Math.round((y-x)/36e5*4)/4 : 0;
}

/* =========================================================
   FOTOS
   ========================================================= */
function comprimir(file, lado=720, max=45000){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let L = lado, q = .7, d = '';
      for(let n=0; n<8; n++){
        const r = Math.min(1, L/Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        d = c.toDataURL('image/jpeg', q);
        if(d.length <= max) break;
        q = Math.max(.4, q-.1); L = Math.round(L*.85);
      }
      URL.revokeObjectURL(url);
      d.length <= max ? ok(d) : ko(new Error('La foto es demasiado grande'));
    };
    img.onerror = () => ko(new Error('No se pudo leer la foto'));
    img.src = url;
  });
}

  const r = S.res || {};
  const [y,m] = (r.mes||'').split('-').map(Number);
  let nombreMes = y ? new Date(y, m-1, 1).toLocaleDateString('es-ES', { month:'long', year:'numeric' }) : ''; nombreMes = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);
  const barras = (obj, fmt) => { const ks = Object.keys(obj||{}); const mx = Math.max(1, ...ks.map(k=>obj[k])); return ks.length ? ks.sort((a,b)=>obj[b]-obj[a]).map(k=>`<div class="bar2"><span>${esc(k)}</span><div class="bt"><div style="width:${obj[k]/mx*100}%"></div></div><b>${fmt(obj[k])}</b></div>`).join('') : '<div class="meta">Sin datos este mes.</div>'; };
  const body = r.cargando ? `<div class="loading"><div class="spin"></div>Calculando…</div>` : r.error ? `<div class="empty">${esc(r.error)}</div>` : `
    <div class="tiles"><div class="tile"><b>${(r.bolos||[]).length}</b><span>bolos</span></div><div class="tile"><b>${eur(r.facturado)}</b><span>presupuestado</span></div><div class="tile"><b>${eur(r.totalGastos)}</b><span>gastos</span></div><div class="tile ${(r.incidencias||[]).length?'warn':''}"><b>${(r.incidencias||[]).length}</b><span>incidencias</span></div></div>
    <div class="furg"><b>Horas por persona</b><div style="margin-top:10px">${barras(r.horas, v=>v+' h')}</div></div>
    <div class="furg"><b>Gastos por tipo</b><div style="margin-top:10px">${barras(r.gastos, eur)}</div></div>
    <div class="furg"><b>Material más usado</b><div style="margin-top:10px">${barras(Object.fromEntries((r.top||[]).map(x=>[x.material,x.cant])), v=>v+' uds')}</div></div>
    ${(r.incidencias||[]).length?`<div class="furg"><b>Incidencias</b>${r.incidencias.map(i=>`<div class="hrow2"><div><b>${esc(i.material)}</b><div class="meta inc">⚠ ${esc(i.incidencia)}${i.nota?': '+esc(i.nota):''} · ${esc(i.num)}</div></div></div>`).join('')}</div>`:''}
    <div class="sec">Bolos del mes</div>
    ${(r.bolos||[]).map(b=>`<button class="card" onclick="abrir('${esc(b.num)}')"><div class="top"><span class="num">${esc(b.num)}</span><span class="date">${esc(b.montaje)}</span></div><div class="ev">${esc(b.evento)}</div><div class="meta">${b.importe?eur(b.importe)+' · ':''}${esc(b.cerrado?'Listo para facturar':(b.estado||''))}${b.firma?' · ✍ firmado':''}</div></button>`).join('') || '<div class="meta">No hay bolos este mes.</div>'}`;
  return `<header><div class="brand"><span class="bw">DREAMSCAPE</span><span class="bs">Events &amp; Productions</span></div>
    <div class="hrow"><button class="back" onclick="S.vista='lista';render()" aria-label="Volver">‹</button><h1>Resumen</h1></div>
    <div class="mesnav"><button onclick="moverMes(-1)" aria-label="Mes anterior">‹</button><b>${esc(nombreMes)}</b><button onclick="moverMes(1)" aria-label="Mes siguiente">›</button></div></header><main>${body}</main>`;
}

/* ---------- RENDER ---------- */
function render(){ const V = { lista:vistaLista, etiq:vistaEtiquetas, hist:vistaHistorial, accesos:vistaAccesos, resumen:vistaResumen, login:vistaLogin }; $('#app').innerHTML = (V[S.vista] || vistaDet)(); dot(); pintarRed(); }
function abrirSheet(h){ $('#sheet').innerHTML = h; $('#sbg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('open')); }
window.addEventListener('popstate', ()=>{ if(S.vista!=='lista' && S.vista!=='login'){ S.vista = S.vista==='hist' && S.num ? 'det' : 'lista'; render(); } });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(COLA.length) vaciarCola(); if(S.pend || !KEY || SCAN || !['lista','det'].includes(S.vista) || $('#sheet').classList.contains('open')) return; S.vista==='det' ? abrir(S.num,true) : cargarLista(); } });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
if(!KEY){ S.vista='login'; render(); setTimeout(()=>{ const i=$('#lgCod'); if(i) i.focus(); }, 300); }
else arrancar();
</script>
</body>
