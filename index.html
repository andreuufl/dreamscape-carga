    <div class="replist">${S.items.map((i,n)=>{ const q = REP[UP(i.material)] || ''; return `<button class="reprow ${q?'on':''} ${q===REP_P?'mine':''}" onclick="repToggle(${n})"><span class="qty">${esc(i.cant)}</span><span class="rm">${esc(i.material)}</span><span class="rp">${esc(q||'—')}</span></button>`; }).join('')}</div>
    <div class="meta" style="margin:8px 0">${sin ? sin+' sin asignar' : 'Todo asignado'}</div>
    <div class="row2"><button class="btn sec2" onclick="repTodo()">Lo que falta → ${esc(REP_P)}</button><button class="btn sec2" onclick="REP={};pintarReparto()">Borrar todo</button></div>

function repToggle(n){ const i = S.items[n]; if(!i) return; const k = UP(i.material); if(REP[k]===REP_P) delete REP[k]; else REP[k] = REP_P; vib(8); const y = $('#sheet').scrollTop; pintarReparto(); $('#sheet').scrollTop = y; }

async function guardarReparto(){

async function confirmarResumen(yaApuntadas){
  const horas = parseFloat(($('#rH').value||'').replace(',','.')) || 0, km = parseFloat(($('#rK').value||'').replace(',','.')) || 0, nota = ($('#rN').value||'').trim();
  const b = $('#rBtn'); b.disabled = true; b.textContent = 'Guardando…';
  try{
    const r = await call('ckResumenOk', S.num, { horas, km, nota });
    if(S.bolo){ S.bolo.ficha.resumen = r || {}; guardarBoloCache(); }
    const falta = Math.round((horas - (yaApuntadas||0))*4)/4;
    if(falta > 0){
      const tipos = (S.yo||{}).tiposGasto || ['Horas'], th = tipos.find(t=>/hora/i.test(t)) || 'Horas';
      try{ const g = await enviar('ckGasto', S.num, { tipo: th, persona: yoNombre(), cantidad: String(falta), nota: 'Desde el resumen del bolo', foto: '' }); S.gastos = S.gastos || []; S.gastos.push(g || { fecha: hora().slice(0,5), tipo: th, persona: yoNombre(), cantidad: falta, importe: '', nota: 'Desde el resumen del bolo' }); cacheSet('ckGastos'+JSON.stringify([S.num]), S.gastos); }catch(e){}
    }
    cerrarSheet(); vib(30); toast(falta>0 ? `Resumen confirmado · ${falta} h apuntadas en Gastos` : 'Resumen confirmado'); render();
  }catch(e){ b.disabled = false; b.textContent = 'Confirmar'; toast(e.red ? 'Necesitas conexión para confirmar' : 'Error: '+e.message); }
}

/* ---------- 3. SEMANA EN LA PESTAÑA HOY ---------- */
function semana(){
  const hoy = diaDe(Date.now()), dias = [];
  for(let d=0; d<14; d++){ const t = hoy + d*864e5, dt = new Date(t); dias.push({ t: diaDe(dt.getTime()), dt }); }
  const de = t => (S.presus||[]).filter(p => !p.cerrado && enRango(p, t));
  const L = ['D','L','M','X','J','V','S'];
  const strip = `<div class="semana">${dias.map(({t,dt})=>{ const n = de(t).length; return `<button class="dia ${S.diaSel===t?'on':''} ${t===hoy?'dhoy':''} ${n?'con':''}" onclick="selDia(${t})"><span>${t===hoy?'Hoy':L[dt.getDay()]}</span><b>${dt.getDate()}</b><i>${n?'●'.repeat(Math.min(3,n)):''}</i></button>`; }).join('')}</div>`;
  if(S.diaSel == null) return strip;
  const l = de(S.diaSel), dt = new Date(S.diaSel);
  let tit = dt.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' }); tit = tit.charAt(0).toUpperCase()+tit.slice(1);
  return strip + `<div class="sec">${esc(tit)} <span class="cnt">${l.length}</span></div>` + (l.length ? l.map(p => tarjetaBolo(p).replace('</button>', `${(p.tecnicos||[]).length?`<div class="meta tecs">${ic('users','xs')} ${esc(p.tecnicos.join(', '))}</div>`:`<div class="meta tecs">Sin equipo asignado</div>`}</button>`)).join('') : `<div class="meta" style="margin:0 4px 14px">Sin bolos este día.</div>`);
}
function selDia(t){ S.diaSel = S.diaSel === t ? null : t; vib(8); render(); }

function b64aBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
async function guardarCfgSW(){ try{ const c = await caches.open('ck-cfg'); await c.put('cfg', new Response(JSON.stringify({ api: API, k: KEY }))); }catch(e){} }
function pushPosible(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
async function suscribirPush(probar){
  if(!pushPosible() || Notification.permission !== 'granted') return false;
  await guardarCfgSW();
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub){ const pub = await call('ckVapid'); sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(pub) }); }
  await call('ckSuscribir', sub.toJSON());
  try{ localStorage.setItem('ck_push', String(Date.now())); }catch(e){}
  if(probar) try{ await call('ckProbarPush'); }catch(e){}
  return true;
}
function revisarPush(){
  // una vez al día renueva la suscripción (y guarda la clave para el aviso)
  try{ if(!pushPosible() || Notification.permission !== 'granted') return; const t = +localStorage.getItem('ck_push') || 0; guardarCfgSW(); if(Date.now() - t > 864e5) suscribirPush(false).catch(()=>{}); }catch(e){}
}

function estadoBolo(p){
  if(p.archivado) return ['fin', p.estado || 'Terminado'];
  if(!p.cerrado && anticipado(p.num) && fueraDeDia(p.num)) return ['antic', 'Material en el lugar'];
  if(p.cerrado || (p.total && p.devueltos === p.total)) return ['listo', 'Listo para facturar'];
  if(p.devueltos > 0) return ['vuelta', 'Por devolver'];
  if(p.total && p.cargados === p.total) return ['curso', 'En curso'];
  if(p.cargados > 0) return ['prep', 'Cargando'];
  return ['pend', 'Por preparar'];
}

let RANGO_MEMO = {}, RANGO_T = 0;
function fichaDe(num){ if(num===S.num && S.bolo) return ficha(); return ((cacheGet('ckBolo'+JSON.stringify([num]))||{}).ficha) || {}; }
function esSoloTec(p){

  if(p.num===S.num && !tot && !S.bolo) return false;
  return !tot;
}
function tsIso(s){ const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]).getTime() : null; }
function isoDe(t){ const d = new Date(t), z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function rangoBolo(p){
  if(Date.now() - RANGO_T > 1500){ RANGO_MEMO = {}; RANGO_T = Date.now(); }
  if(p.num !== S.num && RANGO_MEMO[p.num]) return RANGO_MEMO[p.num];
  const fdb = fichaDe(p.num) || {}, [a, b] = String(fdb.dias || (fdb._drv||{}).dias || '').split('|');
  let i = tsIso(a), j = tsIso(b);
  if(i == null || j == null){ const hb = (p.num === S.num ? (S.bolo||{}).horarioB : ((((S.alm||{})[p.num]||{}).b)||{}).horarioB) || {}, fx = s => { const m = String(s||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : null; }; if(i == null) i = fx(hb.fMontaje); if(j == null) j = fx(hb.fDesmontaje); }
  if(i == null) i = p.ts ? diaDe(p.ts) : null;
  if(i == null) return [null, null];
  if(j == null || j < i) j = i;
  return RANGO_MEMO[p.num] = [i, j];
}
function enRango(p, t){ const [i, j] = rangoBolo(p); return i != null && t >= i && t <= j; }
function diasLista(p){ const [i, j] = rangoBolo(p), l = []; if(i == null) return [diaDe(Date.now())]; for(let t = i; t <= j && l.length < 62; t = diaDe(t + 36*36e5)) l.push(t); return l; }
function horasSeg(x, ahora){ if(x.s && !x.sm) return x.h || 0; return Math.max(0, ((x.sm || ahora || Date.now()) - x.em) / 36e5); }
function segsDia(l, t){ return l.filter(x => diaDe(x.em) === t); }
function fmtH(h){ const m = Math.round((h||0)*60); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
function hm(ms){ const d = new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fDia(t, largo){ let s = new Date(t).toLocaleDateString('es-ES', largo ? { weekday:'long', day:'numeric', month:'long' } : { weekday:'short', day:'numeric', month:'short' }); s = s.replace(/\./g,''); return s.charAt(0).toUpperCase()+s.slice(1); }
function finDiaKey(num, t){ return 'ck_findia_'+num+'_'+isoDe(t); }
function diaCerrado(num, t){ try{ return !!localStorage.getItem(finDiaKey(num, t)); }catch(e){ return false; } }
function rangoTxt(p){ const d = diasLista(p); return d.length > 1 ? `${fDia(d[0])} → ${fDia(d[d.length-1])} · ${d.length} días` : fDia(d[0], true); }

function vistaTecnico(p){

}

/* ---------- 7 y 8. GEOGRAFÍA: mapa, tiempo y hora de salida ---------- */
let GEO = {}; try{ localStorage.removeItem('ck_geo'); GEO = JSON.parse(localStorage.getItem('ck_geo2')||'{}') || {}; }catch(e){}
/* Las direcciones que no se encontraron se vuelven a buscar al abrir la app (por si se ha corregido la dirección o mejorado la búsqueda) */
Object.keys(GEO).forEach(k => { if(GEO[k] === null) delete GEO[k]; });
let geoCola = Promise.resolve();
function geocodificar(lugar){
  const q = destino(lugar); if(!q) return Promise.resolve(null);
  if(GEO[q] !== undefined) return Promise.resolve(GEO[q]);
  const intentos = [q]; const partes = String(lugar).split('|').map(s=>s.trim()).filter(Boolean); if(partes.length > 1) intentos.push(partes.slice(1).join(', '));
  /* Direcciones con planta, edificio, s/n…: se prueba quitando lo que el mapa no entiende */
  const limpia = t => String(t).replace(/\b(\d+\s*[ªºa]?\s*(planta|piso|pl\.?)|planta\s+\w+|edif(icio)?\.?\s+[\wÁÉÍÓÚáéíóúñÑ]+|local\s+\w+|nave\s+\w+|puerta\s+\w+|s\/n)\b,?/gi, '').replace(/\s*,\s*,+/g, ',').replace(/^[\s,]+|[\s,]+$/g, '').replace(/\s{2,}/g, ' ');
  intentos.slice().forEach(t => { const c = limpia(t); if(c && intentos.indexOf(c) < 0) intentos.push(c); const tr = c.split(',').map(x=>x.trim()).filter(Boolean); for(let i = 1; i < tr.length - 1; i++){ const u = tr.slice(i).join(', '); if(intentos.indexOf(u) < 0) intentos.push(u); } });
  const cp = String(q).match(/\b(0[1-9]|[1-4]\d|5[0-2])\d{3}\b/); if(cp && intentos.indexOf(cp[0]+' España') < 0) intentos.push(cp[0]+' España');
  const al = (((S.yo||{}).config)||{}).almacenGeo, zona = al ? '&bounded=1&viewbox=' + [al.lon-1.6, al.lat+1.3, al.lon+1.6, al.lat-1.3].map(n=>n.toFixed(3)).join(',') : '';
  const una = (t, z) => fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es,ad,fr,pt&accept-language=es' + (z||'') + '&q=' + encodeURIComponent(t)).then(r=>r.json()).then(j=>j && j[0] ? { lat:+j[0].lat, lon:+j[0].lon, n: String(j[0].display_name||'').split(',').slice(0,3).join(',').trim() } : null);
  const pruebas = []; if(zona) intentos.forEach(t => pruebas.push([t, zona])); intentos.forEach(t => pruebas.push([t, '']));
  geoCola = geoCola.then(async () => {
    if(GEO[q] !== undefined) return;
    let r = null; for(const [t, z] of pruebas){ try{ r = await una(t, z); }catch(e){ return; } await new Promise(w=>setTimeout(w, 1100)); if(r) break; }
    GEO[q] = r; try{ localStorage.setItem('ck_geo2', JSON.stringify(GEO)); }catch(e){}
  });
  return geoCola.then(()=>GEO[q] || null);
}
const WMO = { 0:['☀️','Despejado'],1:['🌤️','Casi despejado'],2:['⛅','Nubes y claros'],3:['☁️','Nublado'],45:['🌫️','Niebla'],48:['🌫️','Niebla'],51:['🌦️','Llovizna'],53:['🌦️','Llovizna'],55:['🌧️','Llovizna fuerte'],61:['🌧️','Lluvia débil'],63:['🌧️','Lluvia'],65:['🌧️','Lluvia fuerte'],71:['🌨️','Nieve'],73:['🌨️','Nieve'],75:['❄️','Nevada'],80:['🌦️','Chubascos'],81:['🌧️','Chubascos'],82:['⛈️','Chubascos fuertes'],95:['⛈️','Tormenta'],96:['⛈️','Tormenta con granizo'],99:['⛈️','Tormenta con granizo'] };

  let celdas = ''; for(let i=0;i<off;i++) celdas += '<div class="cd vac"></div>';

/* ---------- 3. KITS: un QR marca todo el kit ---------- */
async function leidoKit(id, nombre){
  const el = $('#scanlast') || {};
  try{
    if(!S.plantillas) S.plantillas = await call('ckPlantillas');
    const pl = (S.plantillas||[]).find(p=>String(p.id)===String(id)) || (S.plantillas||[]).find(p=>UP(p.nombre)===UP(nombre));
    if(!pl){ el.className='scanlast bad'; el.textContent = '✕ Kit no encontrado: ' + (nombre||id); pitido(false); return; }
    const k = KM().k, sin = s => UP(String(s).replace(/\s*\([^)]*\)\s*$/,''));
    let n = 0, ya = 0, fuera = [];
    pl.items.forEach(x => {
      const it = S.items.find(i => sin(i.material) === sin(x.nombre));
      if(it){ if(it[k]) ya++; else { toggle(it.fila, true); n++; } return; }
      const ex = esFase() ? null : enExtras(x.nombre); if(ex){ const c = S.modo==='dev' ? 'd' : 'c'; if(!ex[c]){ marcarExtra('extra', ex.nombre); n++; } else ya++; return; }
      fuera.push(x.nombre);
    });
    el.className = 'scanlast good'; el.innerHTML = `✓ Kit «${esc(pl.nombre)}»: ${n} marcados${ya?` · ${ya} ya estaban`:''}${fuera.length?`<br><span style="font-size:13px;font-weight:600;opacity:.9">${fuera.length} no están en este bolo</span>`:''}`;
    vib([30,40,30]); pitido(true); pintarScnt(); setTimeout(siguienteVoz, 300);
  }catch(e){ el.className='scanlast bad'; el.textContent = e.red ? 'Sin conexión para leer el kit' : 'Error: '+e.message; }
}
async function verQrKits(){
  S.vista = 'qrkits'; render(); window.scrollTo(0,0);
  try{ await cargarScript('qrcode.js'); if(!S.plantillas) S.plantillas = await call('ckPlantillas'); }catch(e){ toast('Error: '+e.message); }
  if(S.vista==='qrkits') render();
}
function vistaQrKits(){
  const qr = t => { try{ const q = qrcode(0,'M'); q.addData(unescape(encodeURIComponent(t))); q.make(); return q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }catch(e){ return ''; } };
  const l = S.plantillas || [];

    : `<div class="labels kits">${l.map(p=>`<div class="label"><div class="qr">${qr('DSKIT|'+p.id+'|'+p.nombre)}</div><div class="lt"><b>KIT · ${esc(p.nombre)}</b><small>${p.items.length} cosas</small><span>DREAMSCAPE</span></div></div>`).join('')}</div>`;
  return `<header class="noprint"><div class="hrow"><button class="back" onclick="verPlantillas()" aria-label="Volver">${ic('back')}</button><h1>QR de los kits</h1><button class="ref" onclick="window.print()" aria-label="Imprimir">${ic('download')}</button></div>

function vistaDisponibilidad(){
  const [y, m] = S.ndMes, mios = new Set((S.nodisp||{})[yoNombre()] || []), hoy = fechaISO(Date.now());
  const ini = new Date(y, m, 1), dias = new Date(y, m+1, 0).getDate(), off = (ini.getDay()+6)%7;
  const bolosDia = iso => (S.presus||[]).filter(p=>p.ts && fechaISO(p.ts)===iso && (esAdmin() ? (p.tecnicos||[]).includes(yoNombre()) : true)).length;

/* Dictar por voz: botón de micrófono en los campos de texto de las ventanas */
const VOZ = { rec: null, el: null };
function vozDisponible(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function ponerMicros(root){
  if(!root || !vozDisponible()) return;
  root.querySelectorAll('textarea:not([data-mic])').forEach(t => {
    t.dataset.mic = '1'; if(!t.id) t.id = 'tx' + Math.random().toString(36).slice(2,8);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'mic'; b.dataset.para = t.id;
    b.innerHTML = ic('mic','s') + '<span>Dictar</span>'; b.onclick = () => dictar(t.id, b);
    t.insertAdjacentElement('afterend', b);
  });
}
function dictar(id, b){
  const t = document.getElementById(id); if(!t) return;
  if(VOZ.rec){ try{ VOZ.rec.stop(); }catch(e){} return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec; try{ rec = new SR(); }catch(e){ toast('Usa el micrófono del teclado para dictar'); return; }
  rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = false;
  const base = t.value ? t.value.replace(/\s*$/, ' ') : '';
  VOZ.rec = rec; b.classList.add('on'); b.querySelector('span').textContent = 'Escuchando… toca para parar'; vib(15);
  rec.onresult = e => { let txt = ''; for(let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; t.value = base + txt.charAt(0).toUpperCase() + txt.slice(1); t.dispatchEvent(new Event('input', { bubbles:true })); };
  rec.onerror = e => { if(e.error === 'not-allowed' || e.error === 'service-not-allowed') toast('Permite el micrófono o usa el del teclado'); else if(e.error !== 'no-speech' && e.error !== 'aborted') toast('No se pudo dictar: usa el micrófono del teclado'); };
  rec.onend = () => { VOZ.rec = null; b.classList.remove('on'); b.querySelector('span').textContent = 'Dictar'; };
  try{ rec.start(); }catch(e){ VOZ.rec = null; b.classList.remove('on'); b.querySelector('span').textContent = 'Dictar'; toast('Usa el micrófono del teclado para dictar'); }
}

  const avisoVersion = () => { if($('#nuevaVer')) return; const d = document.createElement('button'); d.id='nuevaVer'; d.className='redbar'; d.style.background='#1f6f4a'; d.textContent='✨ Hay una versión nueva de la app · toca para actualizar'; d.onclick=()=>location.reload(); document.body.appendChild(d); };
  navigator.serviceWorker.addEventListener('message', e => { if(e.data && e.data.tipo==='nueva-version') avisoVersion(); });
  let yaControlado = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', () => { if(yaControlado) avisoVersion(); yaControlado = true; });
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => { reg.update().catch(()=>{}); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); }); }).catch(()=>{});
  let recargado = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(recargado || COLA.length) return; recargado = true; location.reload(); });
}
setTimeout(ocultarSplash, 5000);
if(!KEY){ S.vista='login'; render(); ocultarSplash(); setTimeout(()=>{ const i=$('#lgCod'); if(i) i.focus(); }, 300); }
else arrancar();
</script>
