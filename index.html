<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carga">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Carga · Dreamscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--navy:#16243a;--navy2:#22344f;--bg:#f2f4f7;--card:#fff;--txt:#14202e;--mut:#6b7686;--line:#e3e7ec;--ok:#1f9d55;--okbg:#e5f6ec;--dev:#2b6cb0;--devbg:#e6f0fa;--warn:#d97706;--warnbg:#fff4e0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .bw{font-family:Fraunces,"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:460;letter-spacing:.26em;color:#ece7de;font-size:17px}
.brand .bs{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.3em;color:#c9a66b;font-size:9.5px;margin-top:5px;text-transform:uppercase}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0}
.sub{font-size:13px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:22px;flex:none}
.ref{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:18px;flex:none}
.search{margin-top:12px;width:100%;padding:12px 14px;border-radius:12px;border:0;font:inherit;font-size:16px;background:#fff}
.seg{display:flex;background:var(--navy2);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;color:#c9d3e0;font-weight:600;font-size:15px}
.seg button.on{background:#fff;color:var(--navy)}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:block;width:100%;text-align:left}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.num{font-weight:700;font-size:15px;color:var(--navy)}
.date{font-size:13px;color:var(--mut);white-space:nowrap}
.ev{margin:4px 0 10px;font-size:15px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar small{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.track{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:9px;background:var(--ok);transition:width .3s}
.fill.dev{background:var(--dev)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--warnbg);color:var(--warn);margin-left:6px}
.prog{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.prog .big{font-size:28px;font-weight:800}
.prog .big span{font-size:16px;color:var(--mut);font-weight:600}
.prog .track{height:10px}
.done-banner{background:var(--okbg);color:var(--ok);font-weight:700;text-align:center;padding:14px;border-radius:var(--r);margin-bottom:12px}
.done-banner.dev{background:var(--devbg);color:var(--dev)}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 4px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;min-height:68px;user-select:none;transition:background .15s,transform .1s}
.item:active{transform:scale(.985)}
.chk{width:34px;height:34px;border-radius:10px;border:2.5px solid #c3cad4;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:900}
.item.on .chk{background:var(--ok);border-color:var(--ok)}
.mode-dev .item.on .chk{background:var(--dev);border-color:var(--dev)}
.item.on{background:#fafbfc}
.item.on .mat{color:var(--mut);text-decoration:line-through}
.qty{flex:none;min-width:48px;height:40px;padding:0 8px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px}
.info{flex:1;min-width:0}
.mat{font-weight:600;font-size:16px;word-break:break-word}
.meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.meta .inc{color:var(--warn);font-weight:600}
.more{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.item.has-inc .more{color:var(--warn);background:var(--warnbg)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
.btn.sec2{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:21;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h3{margin:0 0 4px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:10px 14px;border-radius:24px;background:var(--bg);font-weight:600;font-size:15px}
.chip.on{background:var(--warn);color:#fff}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#1b2633;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty,.loading{text-align:center;color:var(--mut);padding:40px 10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.sync{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;margin-left:6px;vertical-align:middle}
.sync.busy{background:#fbbf24}
.steps{display:flex;align-items:center;margin-top:12px;gap:4px}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;color:#aebbd0;font-weight:600;font-size:14px}
.step .n{width:24px;height:24px;border-radius:50%;border:2px solid #4b5f7d;display:grid;place-items:center;font-size:13px;font-weight:800}
.step.on{background:#fff;color:var(--navy)}
.step.on .n{border-color:var(--navy);background:var(--navy);color:#fff}
.step.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .ln{flex:1;height:2px;background:#33486a;min-width:6px}
.dest{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:12px}
.dest .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.dest .place{font-size:21px;font-weight:800;margin:6px 0 4px;word-break:break-word}
.dest .when{color:var(--mut);font-size:14px}
.maps{display:grid;gap:10px;margin-bottom:12px}
.mapbtn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--card);font-weight:700;font-size:16px;color:var(--txt);text-decoration:none}
.mapbtn.main{background:var(--dev);color:#fff}
.mapbtn .ic{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:19px;flex:none}
.mapbtn.main .ic{background:rgba(255,255,255,.18)}
.mapbtn .go{margin-left:auto;opacity:.6;font-size:20px}
.aviso{background:var(--warnbg);color:var(--warn);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;margin-bottom:12px}
.furg{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.furg .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.furg .mat{font-size:20px;font-weight:800;letter-spacing:.06em;text-decoration:none!important;color:var(--txt)!important}
.plate{display:inline-block;border:2px solid var(--txt);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.08em;font-size:18px;background:#fff;color:#14202e}
.plate::before{content:"E";display:inline-block;background:#1e4fb5;color:#fff;font-size:11px;padding:2px 4px;margin:-2px 8px -2px -10px;border-radius:3px 0 0 3px;vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.edit{font-size:14px;font-weight:700;color:var(--dev);padding:6px 10px;border-radius:10px;background:var(--devbg)}
.salida{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:16px;background:var(--ok);color:#fff;font-weight:800;font-size:17px;margin-bottom:12px}
.salida.sent{background:var(--okbg);color:var(--ok)}
.salida[disabled]{opacity:.7}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin:0;min-height:0;background:#fff;color:var(--txt)}
.sheet{max-height:88vh;overflow:auto}
.scan{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;background:var(--card);border:1.5px dashed #b9c3d0;font-weight:700;font-size:15px;margin-bottom:12px;color:var(--navy)}
.scan .ic{font-size:20px}
.scanov{position:fixed;inset:0;background:#000;z-index:50}
.scanov video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:50%;top:45%;width:64vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.scantop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;color:#fff}
.scantop button{background:rgba(255,255,255,.18);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700}
.scanlast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);background:rgba(20,32,46,.92);color:#fff;padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:16px}
.scanlast.good{background:var(--ok)}.scanlast.bad{background:#c0392b}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px}
.contact .lbl{font-size:12px;color:var(--mut);font-weight:600}
.call{flex:none;background:var(--ok);color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:12px}
.hito{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);margin-bottom:10px;text-align:left}
.hito .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.hito b{display:block;font-size:17px}.hito small{color:var(--mut);font-size:13px}
.hito.ok .ic{background:var(--ok);color:#fff;font-weight:900}
.salida.firma{background:var(--navy)}
.pad{position:relative;height:190px;border:1.5px dashed #b9c3d0;border-radius:14px;background:#fff;margin-bottom:4px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:14px;touch-action:none}
.padhint{position:absolute;inset:0;display:grid;place-items:center;color:#a0aab8;pointer-events:none;font-weight:600}
.selfurgo{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--txt)}
.frow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.plate.sm{font-size:15px;margin-bottom:4px}
.danger{color:#c0392b!important}
.fotobtn{display:block;text-align:center;margin-top:10px}
.prev{width:100%;border-radius:12px;display:block;max-height:260px;object-fit:cover}
.card.alerta{background:var(--warnbg);color:var(--warn);border:1.5px solid #f3c98b}
.card.alerta .meta{color:#9a5b06}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.label{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;break-inside:avoid;color:#14202e}
.label .qr{width:64px;height:64px;flex:none}.label .qr svg{width:100%;height:100%}
.label .lt{min-width:0;display:flex;flex-direction:column;gap:2px}
.label b{font-size:12px;line-height:1.2;overflow-wrap:break-word;hyphens:auto}.label small{font-size:11px;color:#6b7686}
.label span{font-family:Fraunces,Georgia,serif;letter-spacing:.2em;font-size:8px;color:#a8844a}
@media (max-width:520px){ .step:not(.on) .t{display:none} .step{padding:8px} }
@media print{ .noprint,.toast,.foot{display:none!important} body{background:#fff} main.etiq{padding:0} .labels{grid-template-columns:repeat(3,1fr)} .sec{margin-top:8px} }
.link{display:block;width:100%;text-align:center;padding:12px;color:var(--mut);font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sbg" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// La clave llega en el enlace (#k=...) y se guarda en este móvil
let KEY = '';
try{ const m = location.hash.match(/k=([\w-]+)/); if(m){ localStorage.setItem('ck_key', m[1]); history.replaceState(null,'',location.pathname); } KEY = localStorage.getItem('ck_key') || ''; }catch(e){ const m = location.hash.match(/k=([\w-]+)/); KEY = m ? m[1] : ''; }
const S = { vista:'lista', filtro:'prox', q:'', presus:[], num:null, items:[], opciones:[], modo:'carga', pend:0, furgos:[], bolo:null, pendientes:[], catalogo:null, enviando:false };
let SALIDAS = {}; try{ SALIDAS = JSON.parse(localStorage.getItem('ck_salidas')||'{}'); }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib = n => { try{ navigator.vibrate && navigator.vibrate(n) }catch(e){} };

const API = 'https://script.google.com/macros/s/AKfycbwEQlNLMpsPbUDbgc3p12dKbyeVm17cIY_-XH3YmIzadhPqSUu12ZoHwxZ4xAfff45-/exec';
async function call(fn, ...args){
  S.pend++; dot();
  try{
    const u = API + '?k=' + encodeURIComponent(KEY) + '&a=' + fn + '&p=' + encodeURIComponent(JSON.stringify(args)) + '&t=' + Date.now();
    const r = await fetch(u, { credentials: 'omit', cache: 'no-store' });
    const j = await r.json();
    if(!j.ok) throw new Error(j.e || 'Error');
    return j.r;
  }catch(e){
    throw new Error(e.message === 'Failed to fetch' || e.name === 'TypeError' ? 'Sin conexión' : e.message);
  }finally{ S.pend--; dot(); }
}
async function callPost(fn, ...args){
  S.pend++; dot();
  try{
    const r = await fetch(API, { method:'POST', body: JSON.stringify({ k:KEY, a:fn, p:args }), credentials:'omit' });
    const j = await r.json();
    if(!j.ok) throw new Error(j.e || 'Error');
    return j.r;
  }catch(e){ throw new Error(e.name === 'TypeError' ? 'Sin conexión' : e.message); }
  finally{ S.pend--; dot(); }
}
function dot(){ const d = $('#dot'); if(d) d.className = 'sync' + (S.pend ? ' busy' : ''); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------- LISTA ---------- */
async function cargarLista(){
  S.vista='lista'; S.num=null; render();
  try{ S.presus = await call('ckPresupuestos'); }catch(e){ toast('Error: '+e.message); }
  if(S.vista==='lista') render();
  call('ckPendientes').then(r=>{ S.pendientes=r; if(S.vista==='lista') render(); }).catch(()=>{});
}
function filtrados(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const lim = hoy.getTime() - 3*864e5;
  let l = S.presus.slice();
  if(S.filtro==='prox') l = l.filter(p => !p.ts || p.ts >= lim || p.cargados > p.devueltos);
  if(S.q){ const q=S.q.toLowerCase(); l = l.filter(p => (p.num+' '+p.evento).toLowerCase().includes(q)); }
  l.sort((a,b)=> S.filtro==='prox' ? (a.ts||9e15)-(b.ts||9e15) : (b.ts||0)-(a.ts||0));
  return l;
}
function vistaLista(){
  const l = filtrados();
  const body = !S.presus.length ? `<div class="loading"><div class="spin"></div>Cargando presupuestos…</div>`
    : !l.length ? `<div class="empty">No hay presupuestos ${S.filtro==='prox'?'próximos':''}</div>`
    : l.map(p => {
      const pc = p.total ? p.cargados/p.total*100 : 0, pd = p.total ? p.devueltos/p.total*100 : 0;
      return `<button class="card" onclick="abrir('${esc(p.num)}')">
        <div class="top"><span class="num">${esc(p.num)}${p.incidencias?`<span class="tag">⚠ ${p.incidencias}</span>`:''}</span><span class="date">${esc(p.montaje)}</span></div>
        <div class="ev">${esc(p.evento)}</div>
        <div class="bars">
          <div class="bar"><small><span>🚚 Carga</span><b>${p.cargados}/${p.total}</b></small><div class="track"><div class="fill" style="width:${pc}%"></div></div></div>
          <div class="bar"><small><span>🏠 Vuelta</span><b>${p.devueltos}/${p.total}</b></small><div class="track"><div class="fill dev" style="width:${pd}%"></div></div></div>
        </div></button>`;
    }).join('');
  const pendHtml = (S.pendientes||[]).map(x=>`<button class="card alerta" onclick="abrir('${esc(x.num)}')"><b>⚠ Material sin devolver</b><div class="meta">${esc(x.num)} · ${esc(x.evento)} · ${x.n} artículos</div></button>`).join('');
  return `<header>
    <div class="brand" aria-label="Dreamscape Events & Productions"><span class="bw">DREAMSCAPE</span><span class="bs">Events &amp; Productions</span></div>
    <div class="hrow"><h1>Carga de material<span class="sync" id="dot"></span></h1><button class="ref" onclick="verEtiquetas()" aria-label="Etiquetas QR">⌗</button><button class="ref" onclick="cargarFurgos().then(abrirFurgos)" aria-label="Furgonetas">🚐</button><button class="ref" onclick="cargarLista()" aria-label="Actualizar">↻</button></div>
    <input class="search" placeholder="Buscar nº o cliente…" value="${esc(S.q)}" oninput="S.q=this.value;redibujarLista()">
    <div class="seg"><button class="${S.filtro==='prox'?'on':''}" onclick="S.filtro='prox';render()">Próximos</button><button class="${S.filtro==='todos'?'on':''}" onclick="S.filtro='todos';render()">Todos</button></div>
  </header><main id="lista">${pendHtml}${body}</main>`;
}
function redibujarLista(){ const m=document.createElement('div'); m.innerHTML=vistaLista(); $('#lista').innerHTML=m.querySelector('#lista').innerHTML; }

/* ---------- DETALLE ---------- */
async function abrir(num, refresco){
  const nuevo = !refresco; S.vista='det'; S.num=num; if(nuevo){ S.items=[]; S.bolo=null; }
  const p = S.presus.find(x=>x.num===num);
  if(nuevo){
    const f = (S.bolo||{}).ficha || {};
    S.modo = !p || !p.total || p.cargados<p.total ? 'carga' : (p.devueltos>0 ? 'dev' : 'ruta');
  }
  if(nuevo){ try{history.pushState({v:'det'},'')}catch(e){} render(); window.scrollTo(0,0); }
  const [rm, rb] = await Promise.allSettled([call('ckMaterial', num), call('ckBolo', num)]);
  if(rm.status==='fulfilled'){ S.items=rm.value.items; S.opciones=rm.value.opciones; actualizarResumen(); } else toast('Error: '+rm.reason.message);
  if(rb.status==='fulfilled'){
    S.bolo = rb.value; S.furgos = rb.value.furgonetas || [];
    const f = S.bolo.ficha||{};
    if(nuevo && S.modo==='ruta' && (f.llegada || SALIDAS[num])) S.modo='montaje';

function ficha(){ return (S.bolo && S.bolo.ficha) || {}; }
function vistaDet(){

  let foot0 = null;
  const fila = i => `<div class="item ${i[k]?'on':''} ${i.incidencia?'has-inc':''}" id="it${i.fila}" onclick="toggle(${i.fila})">

    : `<div class="foot"><div class="row2"><button class="btn sec2" onclick="todo(${hechos!==tot})">${hechos===tot?'Desmarcar todo':'Marcar todo'}</button><button class="btn" ${S.enviando?'disabled':''} onclick="vuelta()">${S.enviando?'Enviando…':(ficha().vuelta?'Reenviar resumen':'Terminar y enviar')}</button></div></div>`;

function stepper(tot){
  const c = S.items.filter(i=>i.cargado).length, d = S.items.filter(i=>i.devuelto).length, f = ficha();

  return `<div class="steps">${pasos.map(([m,n,t])=>`<button class="step ${S.modo===m?'on':''} ${ok[m]?'ok':''}" onclick="irA('${m}')"><span class="n">${ok[m]?'✓':n}</span><span class="t">${t}</span></button>`).join('<span class="ln"></span>')}</div>`;
}
function irA(m, faltan){

  S.modo = m; render(); window.scrollTo(0,0);
}
function destino(l){ return String(l||'').replace(/["“”«»]/g,'').replace(/\s*\|\s*/g,', ').trim(); }
function tel(t){ return String(t||'').replace(/[^\d+]/g,''); }

    ? `<div class="contact"><div><div class="lbl">Contacto en el lugar</div><b>${esc(f.contacto||'Sin nombre')}</b>${f.telefono?`<div class="meta">${esc(f.telefono)}</div>`:''}</div>${f.telefono?`<a class="call" href="tel:${esc(tel(f.telefono))}">📞 Llamar</a>`:''}</div>` : '';

function guardarFotos(){ try{ const ks=Object.keys(FOTOS); while(ks.length>3){ delete FOTOS[ks.shift()]; } localStorage.setItem('ck_fotos', JSON.stringify(FOTOS)); }catch(e){} }
function tarjetaFoto(){
  const f = FOTOS[S.num];

function fotoElegida(inp){
  const file = inp.files && inp.files[0]; if(!file) return;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const max = 1280, r = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    FOTOS[S.num] = c.toDataURL('image/jpeg', .72); guardarFotos(); URL.revokeObjectURL(url); render(); toast('Foto lista para el correo');
  };
  img.onerror = () => toast('No se pudo leer la foto');
  img.src = url;
}

let firmaTrazo = false;
function abrirFirma(){
  abrirSheet(`<h3>✍ Firma del cliente</h3><div class="meta" style="margin-bottom:10px">Se genera un albarán en PDF con el material montado y te llega por correo.</div>
    <div class="row2"><label class="fld"><span>Nombre</span><input id="fNom" autocomplete="off" value="${esc(ficha().contacto||'')}"></label><label class="fld"><span>DNI (opcional)</span><input id="fDni" autocomplete="off"></label></div>
    <div class="pad"><canvas id="pad"></canvas><span class="padhint">Firma aquí con el dedo</span></div>
    <button class="link" onclick="limpiarFirma()" style="padding:8px">Borrar firma</button>
    <div class="row2"><button class="btn sec2" onclick="cerrarSheet()">Cancelar</button><button class="btn" id="btnFirmar" onclick="enviarFirma()">Firmar y enviar</button></div>`);
  setTimeout(initPad, 260);
}
function initPad(){
  const c = $('#pad'); if(!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth = 2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#14202e';
  firmaTrazo = false; let dib = false;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  c.onpointerdown = e => { dib = true; c.setPointerCapture(e.pointerId); const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); e.preventDefault(); };
  c.onpointermove = e => { if(!dib) return; const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); if(!firmaTrazo){ firmaTrazo=true; const h=document.querySelector('.padhint'); if(h) h.hidden=true; } e.preventDefault(); };
  c.onpointerup = c.onpointercancel = () => { dib = false; };
}
function limpiarFirma(){ initPad(); const h=document.querySelector('.padhint'); if(h) h.hidden=false; }
async function enviarFirma(){
  const nom = ($('#fNom').value||'').trim(), dni = ($('#fDni').value||'').trim();
  if(!nom){ toast('Escribe el nombre de quien firma'); return; }
  if(!firmaTrazo){ toast('Falta la firma'); return; }
  const c = $('#pad'), w = document.createElement('canvas'); w.width = c.width; w.height = c.height;
  const x = w.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w.width,w.height); x.drawImage(c,0,0);
  const png = w.toDataURL('image/png');
  const b = $('#btnFirmar'); b.disabled = true; b.textContent = 'Enviando…';
  try{ const h = await callPost('ckFirma', S.num, nom, dni, png); if(S.bolo){ S.bolo.ficha.firma = nom; S.bolo.ficha.firmaHora = h; } cerrarSheet(); vib(30); toast('Albarán firmado y enviado'); render(); }
  catch(e){ b.disabled = false; b.textContent = 'Firmar y enviar'; toast('No se envió: '+e.message); }
}

/* ---------- FICHA DEL BOLO ---------- */
function abrirFicha(){
  if(!S.bolo){ toast('Cargando ficha…'); return; }
  const f = ficha(), eq = S.bolo.equipo||[], sel = new Set(f.tecnicos||[]);
  const campo = (id, t, ph, tipo) => `<label class="fld"><span>${t}</span><input id="b_${id}" type="${tipo||'text'}" value="${esc(f[id])}" placeholder="${ph}" autocomplete="off"></label>`;
  abrirSheet(`<h3>ℹ Ficha del bolo</h3><div class="meta" style="margin-bottom:12px">${esc(S.bolo.cliente||'')}</div>
    <div class="row2">${campo('contacto','Contacto en el lugar','Nombre')}${campo('telefono','Teléfono','600 000 000','tel')}</div>
    ${campo('horario','Horarios','Ej. Carga 9:00 · Prueba 17:00 · Evento 20:30')}
    <label class="fld"><span>Acceso</span><textarea id="b_acceso" rows="2" placeholder="Ej. Entrada por la calle de atrás, montacargas hasta las 18h">${esc(f.acceso)}</textarea></label>
    <label class="fld"><span>Notas</span><textarea id="b_notas" rows="2">${esc(f.notas)}</textarea></label>
    <div class="fld"><span>Técnicos que van</span><div class="chips" style="margin:6px 0 0">${eq.length? eq.map(t=>`<button class="chip tec ${sel.has(t.nombre)?'on':''}" data-n="${esc(t.nombre)}" onclick="this.classList.toggle('on')">${esc(t.nombre)}</button>`).join('') : '<span class="meta">Añade personas en la pestaña Equipo.</span>'}</div></div>
    <div class="row2" style="margin-top:14px"><button class="btn sec2" onclick="cerrarSheet()">Cancelar</button><button class="btn" onclick="guardarFichaUI()">Guardar</button></div>`);
}
async function guardarFichaUI(){
  const patch = {}; ['contacto','telefono','horario','acceso','notas'].forEach(c=> patch[c] = ($('#b_'+c).value||'').trim());
  patch.tecnicos = [...document.querySelectorAll('.chip.tec.on')].map(b=>b.dataset.n);
  const prev = Object.assign({}, S.bolo.ficha); Object.assign(S.bolo.ficha, patch); cerrarSheet(); render();
  try{ await call('ckGuardarFicha', S.num, patch); toast('Ficha guardada'); }
  catch(e){ S.bolo.ficha = prev; render(); toast('No se guardó: '+e.message); }
}

/* ---------- ESCÁNER QR ---------- */
let SCAN = null;
function cargarScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function abrirScan(){
  const ov = document.createElement('div'); ov.className='scanov'; ov.id='scanov';
  ov.innerHTML = `<video id="scanv" playsinline muted></video><div class="scanframe"></div>
    <div class="scantop"><b>${S.modo==='carga'?'Cargar':'Devolver'} escaneando</b><button onclick="cerrarScan()">Cerrar</button></div>
    <div class="scanlast" id="scanlast">Apunta al código QR de la etiqueta</div>`;
  document.body.appendChild(ov);
  try{
    await cargarScript('jsqr.js');
    const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    const v = $('#scanv'); v.srcObject = st; await v.play();
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently:true });
    SCAN = { st, ultimo:'', t:0, on:true };
    const loop = () => {
      if(!SCAN || !SCAN.on) return;
      if(v.readyState === v.HAVE_ENOUGH_DATA){
        const w = 480, h = Math.round(v.videoHeight * w / v.videoWidth); c.width = w; c.height = h;
        x.drawImage(v, 0, 0, w, h);
        const r = jsQR(x.getImageData(0,0,w,h).data, w, h, { inversionAttempts:'dontInvert' });
        if(r && r.data && (r.data !== SCAN.ultimo || Date.now()-SCAN.t > 2500)){ SCAN.ultimo = r.data; SCAN.t = Date.now(); leido(r.data); }
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ $('#scanlast').textContent = 'No se pudo abrir la cámara. Permite el acceso a la cámara en Safari.'; }
}
function cerrarScan(){ if(SCAN){ SCAN.on=false; try{ SCAN.st.getTracks().forEach(t=>t.stop()); }catch(e){} SCAN=null; } const o=$('#scanov'); if(o) o.remove(); render(); }
function leido(txt){
  const p = String(txt).split('|'), cod = (p[0]==='DS' ? p[1] : '') || '', nom = (p[0]==='DS' ? p[2] : txt) || '';
  const U = s => String(s||'').trim().toUpperCase();
  const it = S.items.find(i => U(i.material)===U(nom) || (cod && (U(i.material).includes('('+U(cod)+')') || U(i.material)===U(cod))));
  const el = $('#scanlast') || {};
  if(!it){ el.className='scanlast bad'; el.textContent = '✕ ' + (nom||txt) + ' no está en este presupuesto'; vib([60,60,60]); return; }
  const k = S.modo==='carga' ? 'cargado' : 'devuelto';
  if(it[k]){ el.className='scanlast'; el.textContent = '✓ ' + it.material + ' ya estaba marcado'; return; }
  el.className='scanlast good'; el.textContent = '✓ ' + it.cant + ' × ' + it.material; vib(40);
  toggle(it.fila, true);
}

/* ---------- ETIQUETAS QR ---------- */
async function verEtiquetas(){
  S.vista='etiq'; render(); window.scrollTo(0,0);
  try{ await cargarScript('qrcode.js'); if(!S.catalogo) S.catalogo = await call('ckCatalogo'); }catch(e){ toast('Error: '+e.message); }
  if(S.vista==='etiq') render();
}
function vistaEtiquetas(){
  const cats = {}; (S.catalogo||[]).forEach(x=>{ (cats[x.cat||'Otros'] = cats[x.cat||'Otros'] || []).push(x); });
  const qr = t => { try{ const q = qrcode(0,'M'); q.addData(unescape(encodeURIComponent(t))); q.make(); return q.createSvgTag({ cellSize:3, margin:0, scalable:true }); }catch(e){ return ''; } };
  const body = !S.catalogo ? `<div class="loading"><div class="spin"></div>Cargando catálogo…</div>`
    : Object.keys(cats).map(c=>`<div class="sec">${esc(c)}</div><div class="labels">${cats[c].map(x=>`<div class="label"><div class="qr">${qr('DS|'+x.codigo+'|'+x.nombre)}</div><div class="lt"><b>${esc(x.nombre)}</b><small>${esc(x.codigo)}</small><span>DREAMSCAPE</span></div></div>`).join('')}</div>`).join('');
  return `<header class="noprint">
    <div class="brand"><span class="bw">DREAMSCAPE</span><span class="bs">Events &amp; Productions</span></div>
    <div class="hrow"><button class="back" onclick="S.vista='lista';render()" aria-label="Volver">‹</button><h1>Etiquetas QR</h1><button class="ref" onclick="window.print()" aria-label="Imprimir">🖨</button></div>
    <div class="sub" style="margin-top:8px;white-space:normal">Imprime en papel adhesivo y pega cada etiqueta en su equipo. Al escanearla, la app marca ese material.</div>
  </header><main class="etiq">${body}</main>`;
}
function copiar(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('Dirección copiada'),()=>toast(t)); }catch(e){ toast(t); } }
function actualizarResumen(){
  const p = S.presus.find(x=>x.num===S.num); if(!p) return;
  p.cargados = S.items.filter(i=>i.cargado).length;
  p.devueltos = S.items.filter(i=>i.devuelto).length;
  p.incidencias = S.items.filter(i=>i.incidencia).length;
}
function hora(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return `${z(d.getDate())}/${z(d.getMonth()+1)} ${z(d.getHours())}:${z(d.getMinutes())}`; }

async function toggle(fila, soloMarcar){
  const it = S.items.find(i=>i.fila===fila); if(!it) return;
  if(soloMarcar && it[S.modo==='carga'?'cargado':'devuelto']) return;
  const modo = S.modo, k = modo==='carga'?'cargado':'devuelto', hk = modo==='carga'?'hCarga':'hDev';
  const prev = [it[k], it[hk]];
  it[k] = !it[k]; it[hk] = it[k] ? hora() : '';
  vib(it[k] ? 15 : [8,40,8]);
  actualizarResumen(); if(!SCAN) render();
  try{ it[hk] = await call('ckMarcar', fila, S.num, it.material, modo, it[k]); if(!SCAN) render(); }
  catch(e){ it[k]=prev[0]; it[hk]=prev[1]; actualizarResumen(); render(); toast('No se guardó: '+e.message); }
}
async function todo(valor){
  const modo=S.modo, k = modo==='carga'?'cargado':'devuelto', hk = modo==='carga'?'hCarga':'hDev';
  if(!confirm(valor ? `¿Marcar los ${S.items.length} artículos como ${modo==='carga'?'cargados':'devueltos'}?` : '¿Desmarcar todos?')) return;
  const prev = S.items.map(i=>[i[k],i[hk]]);
  S.items.forEach(i=>{ i[k]=valor; i[hk]=valor?hora():''; }); vib(30);
  actualizarResumen(); render();
  try{ await call('ckMarcarTodo', S.num, modo, valor); toast('Guardado en la hoja'); }
  catch(e){ S.items.forEach((i,n)=>{ i[k]=prev[n][0]; i[hk]=prev[n][1]; }); actualizarResumen(); render(); toast('No se guardó: '+e.message); }
}

/* ---------- INCIDENCIAS ---------- */
let incFila=null, incSel='';
function abrirInc(fila){
  const it = S.items.find(i=>i.fila===fila); if(!it) return;
  incFila=fila; incSel=it.incidencia||'';
  $('#sheet').innerHTML = `<h3>${esc(it.material)}</h3><div class="meta">Cantidad: ${esc(it.cant)}</div>
    <div class="chips">${S.opciones.map(o=>`<button class="chip ${o===incSel?'on':''}" onclick="selInc(this,'${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}</div>
    <textarea id="nota" placeholder="Nota (qué ha pasado, cuántas unidades…)">${esc(it.nota)}</textarea>
    <div class="row2"><button class="btn sec2" onclick="guardarInc(true)">Quitar</button><button class="btn" onclick="guardarInc(false)">Guardar</button></div>`;
  $('#sbg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('open'));
}
function selInc(el,o){ incSel = incSel===o ? '' : o; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c.textContent===incSel)); }
function cerrarSheet(){ $('#sheet').classList.remove('open'); setTimeout(()=>$('#sbg').style.display='none',200); }
async function guardarInc(quitar){
  const it = S.items.find(i=>i.fila===incFila); if(!it) return;
  const prev=[it.incidencia,it.nota];
  it.incidencia = quitar ? '' : incSel; it.nota = quitar ? '' : $('#nota').value.trim();
  if(!quitar && !it.incidencia && it.nota) it.incidencia = S.opciones.includes('Otro') ? 'Otro' : '';
  cerrarSheet(); actualizarResumen(); render();
  try{ await call('ckIncidencia', it.fila, S.num, it.material, it.incidencia, it.nota); toast(quitar?'Incidencia quitada':'Incidencia guardada'); }
  catch(e){ it.incidencia=prev[0]; it.nota=prev[1]; actualizarResumen(); render(); toast('No se guardó: '+e.message); }
}

/* ---------- RENDER ---------- */
function render(){ $('#app').innerHTML = S.vista==='lista' ? vistaLista() : S.vista==='etiq' ? vistaEtiquetas() : vistaDet(); dot(); }
function abrirSheet(h){ $('#sheet').innerHTML = h; $('#sbg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('open')); }
window.addEventListener('popstate', ()=>{ if(S.vista==='det'){ S.vista='lista'; render(); } });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(S.pend || !KEY || SCAN || S.vista==='etiq' || $('#sheet').classList.contains('open')) return; S.vista==='det' ? abrir(S.num,true) : cargarLista(); } });
if(!KEY){ document.getElementById('app').innerHTML = '<div class="empty" style="padding-top:30vh">Abre la app con el enlace que lleva la clave.</div>'; }
else { cargarLista(); cargarFurgos(); }
</script>
