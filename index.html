  const b = (num, campo, val, txt, cls) => `<button class="btn ${cls||''}" onclick="marcarCobro('${esc(num)}','${campo}',${val})">${txt}</button>`;
  let body;
  if(!l) body = `<div class="loading"><div class="spin"></div>Cargando…</div>`;
  else {
    const sinF = l.filter(c=>!c.facturado), pend = l.filter(c=>c.facturado && !c.cobrado).sort((a,b)=>a.facturadoTs-b.facturadoTs), cob = l.filter(c=>c.cobrado);
    body = `<div class="sec">Por facturar <span class="cnt">${sinF.length}</span></div>${sinF.map(c=>fila(c, b(c.num,'facturado',true,'Marcar facturado') + `<button class="btn sec2" onclick="abrir('${esc(c.num)}').then(verFactura)">Datos factura</button>`)).join('') || '<div class="meta" style="margin:0 4px">Nada pendiente.</div>'}
      <div class="sec">Pendiente de cobro <span class="cnt">${pend.length}</span></div>${pend.map(c=>fila(c, b(c.num,'cobrado',true,'Marcar cobrado','okb') + b(c.num,'facturado',false,'Deshacer','sec2'))).join('') || '<div class="meta" style="margin:0 4px">Todo cobrado. 👍</div>'}
      ${cob.length ? `<div class="sec">Cobrados (últimos 60 días) <span class="cnt">${cob.length}</span></div>${cob.map(c=>fila(c, b(c.num,'cobrado',false,'Deshacer','sec2'))).join('')}` : ''}`;
  }
  return `<header class="top">${BRAND}<div class="hrow"><button class="back" onclick="S.vista='lista';render()" aria-label="Volver">${ic('back')}</button><h1>Cobros</h1><button class="ref" onclick="verCobros()" aria-label="Actualizar">${ic('refresh')}</button></div></header><main>${body}</main>`;
}
async function marcarCobro(num, campo, val){
  try{ const r = await call('ckCobro', num, campo, val); const c = (S.cobros||[]).find(x=>x.num===num); if(c){ c.facturado = r.facturado||''; c.facturadoTs = r.facturadoTs||0; c.cobrado = r.cobrado||''; } vib(15); toast(val ? (campo==='cobrado'?'Marcado como cobrado':'Marcado como facturado') : 'Deshecho'); render(); }
  catch(e){ toast(e.red ? 'Necesitas conexión' : 'Error: '+e.message); }
}

/* ---------- 3. KITS: un QR marca todo el kit ---------- */
async function leidoKit(id, nombre){
  const el = $('#scanlast') || {};
  try{
    if(!S.plantillas) S.plantillas = await call('ckPlantillas');
    const pl = (S.plantillas||[]).find(p=>String(p.id)===String(id)) || (S.plantillas||[]).find(p=>UP(p.nombre)===UP(nombre));
    if(!pl){ el.className='scanlast bad'; el.textContent = '✕ Kit no encontrado: ' + (nombre||id); pitido(false); return; }
    const k = KM().k, sin = s => UP(String(s).replace(/\s*\([^)]*\)\s*$/,''));
    let n = 0, ya = 0, fuera = [];
    pl.items.forEach(x => {
      const it = S.items.find(i => sin(i.material) === sin(x.nombre));
      if(it){ if(it[k]) ya++; else { toggle(it.fila, true); n++; } return; }
      const ex = esFase() ? null : enExtras(x.nombre); if(ex){ const c = S.modo==='dev' ? 'd' : 'c'; if(!ex[c]){ marcarExtra('extra', ex.nombre); n++; } else ya++; return; }
      fuera.push(x.nombre);
    });
    el.className = 'scanlast good'; el.innerHTML = `✓ Kit «${esc(pl.nombre)}»: ${n} marcados${ya?` · ${ya} ya estaban`:''}${fuera.length?`<br><span style="font-size:13px;font-weight:600;opacity:.9">${fuera.length} no están en este bolo</span>`:''}`;
    vib([30,40,30]); pitido(true); pintarScnt(); setTimeout(siguienteVoz, 300);
  }catch(e){ el.className='scanlast bad'; el.textContent = e.red ? 'Sin conexión para leer el kit' : 'Error: '+e.message; }
}
async function verQrKits(){
  S.vista = 'qrkits'; render(); window.scrollTo(0,0);
  try{ await cargarScript('qrcode.js'); if(!S.plantillas) S.plantillas = await call('ckPlantillas'); }catch(e){ toast('Error: '+e.message); }
  if(S.vista==='qrkits') render();
}
function vistaQrKits(){
  const qr = t => { try{ const q = qrcode(0,'M'); q.addData(unescape(encodeURIComponent(t))); q.make(); return q.createSvgTag({ cellSize:4, margin:0, scalable:true }); }catch(e){ return ''; } };
  const l = S.plantillas || [];
  const body = typeof qrcode === 'undefined' || !S.plantillas ? `<div class="loading"><div class="spin"></div>Preparando…</div>`
    : `<div class="labels kits">${l.map(p=>`<div class="label"><div class="qr">${qr('DSKIT|'+p.id+'|'+p.nombre)}</div><div class="lt"><b>KIT · ${esc(p.nombre)}</b><small>${p.items.length} cosas</small><span>DREAMSCAPE</span></div></div>`).join('')}</div>`;
  return `<header class="noprint"><div class="hrow"><button class="back" onclick="verPlantillas()" aria-label="Volver">${ic('back')}</button><h1>QR de los kits</h1><button class="ref" onclick="window.print()" aria-label="Imprimir">${ic('download')}</button></div>
    <div class="sub" style="margin-top:8px;white-space:normal">Pega cada QR en la caja o flight case del kit. Al escanearlo se marca todo lo que lleva el kit de una vez.</div></header><main class="etiq">${body}</main>`;
}

/* ---------- 4. CHECKLIST DE VUELTA ---------- */
const VUELTA_DEF = ['Material limpio', 'Baterías y pilas a cargar', 'Cables enrollados y con brida', 'Probado y funciona', 'Cada cosa en su sitio del almacén'];
function listaVuelta(){ const l = cfg().checklistVuelta; return l && l.length ? l : VUELTA_DEF; }
function tarjetaChecklistVuelta(){
  if(!S.bolo) return '';
  const l = listaVuelta(), ch = ficha().checksVuelta || {}, h = l.filter(x=>ch[x]).length;
  return `<div class="furg"><div class="top"><b>${ic('checksq','s')} Antes de guardar</b><span class="meta">${h}/${l.length}</span></div>
    ${l.map((x,i)=>`<button class="ck ${ch[x]?'on':''}" onclick="marcarVuelta(${i})"><span class="cb">${ch[x]?'✓':''}</span><span><b>${esc(x)}</b>${ch[x]?`<small>${esc(ch[x])}</small>`:''}</span></button>`).join('')}</div>`;
}
async function marcarVuelta(i){
  const x = listaVuelta()[i], f = S.bolo.ficha; f.checksVuelta = f.checksVuelta || {};
  const val = !f.checksVuelta[x], prev = f.checksVuelta[x];
  if(val) f.checksVuelta[x] = yoNombre() + ' · ' + hora(); else delete f.checksVuelta[x];
  vib(12); render();
  try{ const r = await call('ckCheckVuelta', S.num, x, val); f.checksVuelta = r || {}; guardarBoloCache(); }
  catch(e){ if(prev) f.checksVuelta[x] = prev; else delete f.checksVuelta[x]; render(); toast(e.red ? 'Necesitas conexión' : 'Error: '+e.message); }
}
function editarChecklistVuelta(){
  abrirSheet(`<h3>${ic('checksq')} Checklist de vuelta</h3><div class="meta" style="margin-bottom:10px">Lo que hay que revisar al devolver el material al almacén. Una línea por paso.</div>
    <textarea id="clv" rows="8">${esc(listaVuelta().join('\n'))}</textarea>
    <div class="row2" style="margin-top:12px"><button class="btn sec2" onclick="cerrarSheet()">Cancelar</button><button class="btn" onclick="guardarChecklistVuelta()">Guardar</button></div>`);
}
async function guardarChecklistVuelta(){
  try{ const c = await call('ckGuardarChecklistVuelta', $('#clv').value.split('\n').map(s=>s.trim()).filter(Boolean)); S.yo.config = c; cacheSet('ckYo[]', S.yo); cerrarSheet(); toast('Checklist guardada'); }
  catch(e){ toast('No se guardó: '+e.message); }
}

/* ---------- 5. DISPONIBILIDAD DEL EQUIPO ---------- */
function noDispDe(nombre, ts){ return ((S.nodisp||{})[nombre]||[]).includes(fechaISO(ts)); }
async function verDisponibilidad(){
  S.vista = 'nodisp'; if(!S.ndMes){ const d = new Date(); S.ndMes = [d.getFullYear(), d.getMonth()]; }
  try{ history.pushState({v:'nodisp'},''); }catch(e){}
  render(); window.scrollTo(0,0);
  try{ S.nodisp = await call('ckNoDisp') || {}; }catch(e){ toast(e.red ? 'Necesitas conexión' : 'Error: '+e.message); }
  if(S.vista==='nodisp') render();
}
function vistaDisponibilidad(){
  const [y, m] = S.ndMes, mios = new Set((S.nodisp||{})[yoNombre()] || []), hoy = fechaISO(Date.now());
  const ini = new Date(y, m, 1), dias = new Date(y, m+1, 0).getDate(), off = (ini.getDay()+6)%7;
  const bolosDia = iso => (S.presus||[]).filter(p=>p.ts && fechaISO(p.ts)===iso && (esAdmin() ? (p.tecnicos||[]).includes(yoNombre()) : true)).length;
  let c = ''; for(let i=0;i<off;i++) c += '<div class="cd vac"></div>';
  for(let d=1; d<=dias; d++){ const iso = fechaISO(new Date(y,m,d)), pas = iso < hoy, nb = bolosDia(iso);
    c += `<button class="cd nd ${mios.has(iso)?'no':''} ${iso===hoy?'hoy':''}" ${pas?'disabled':''} onclick="toggleNoDisp('${iso}')"><span>${d}</span>${mios.has(iso)?'<i class="ndx">No puedo</i>':''}${nb?`<i class="ndb">${nb} bolo${nb>1?'s':''}</i>`:''}</button>`; }
  let tit = ini.toLocaleDateString('es-ES', { month:'long', year:'numeric' }); tit = tit.charAt(0).toUpperCase()+tit.slice(1);
  const otros = esAdmin() ? Object.entries(S.nodisp||{}).filter(([n,l])=>n!==yoNombre() && l.length) : [];
  return `<header class="top">${BRAND}<div class="hrow"><button class="back" onclick="S.vista='lista';render()" aria-label="Volver">${ic('back')}</button><h1>Días que no puedo</h1></div>
    <div class="mesnav"><button onclick="moverND(-1)" aria-label="Mes anterior">‹</button><b>${esc(tit)}</b><button onclick="moverND(1)" aria-label="Mes siguiente">›</button></div></header>
    <main><div class="meta" style="margin:0 4px 10px">Toca los días que <b>no</b> puedes trabajar. Andreu lo verá al asignar los bolos.</div>
    <div class="calg">${['L','M','X','J','V','S','D'].map(x=>`<div class="cdh">${x}</div>`).join('')}${c}</div>
    ${otros.length ? `<div class="sec">El equipo no puede</div>${otros.map(([n,l])=>`<div class="furg"><b>${esc(n)}</b><div class="meta">${esc(l.slice(0,12).map(d=>new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})).join(' · '))}${l.length>12?' …':''}</div></div>`).join('')}` : ''}</main>`;
}
function moverND(d){ const [y,m] = S.ndMes, x = new Date(y, m+d, 1); S.ndMes = [x.getFullYear(), x.getMonth()]; render(); }
let ND_T = null;
function toggleNoDisp(iso){
  S.nodisp = S.nodisp || {}; const l = new Set(S.nodisp[yoNombre()] || []);
  l.has(iso) ? l.delete(iso) : l.add(iso); S.nodisp[yoNombre()] = [...l].sort(); vib(10); render();
  clearTimeout(ND_T); ND_T = setTimeout(async ()=>{ try{ S.nodisp[yoNombre()] = await call('ckGuardarNoDisp', S.nodisp[yoNombre()]); toast('Guardado'); }catch(e){ toast(e.red ? 'Sin conexión: no se guardó' : 'Error: '+e.message); } }, 900);
}

/* ---------- 6. ESTADO DEL LUGAR (fotos al llegar y al irse) ---------- */
function tarjetaEstadoLugar(tipo){
  if(S.fotos === null){ cargarFotos().then(()=>{ if(S.vista==='det') render(); }); }
  const l = (S.fotos||[]).filter(f=>f.tipo===tipo), lleg = tipo==='lugar-llegada';
  return `<div class="furg"><div class="top"><b>${ic('camera','s')} Estado del lugar ${lleg?'al llegar':'al irnos'}</b><span class="meta">${l.length}</span></div>
    ${l.length?`<div class="fgrid">${l.map(f=>`<img src="${f.img}" alt="Estado del lugar">`).join('')}</div>`:`<div class="meta" style="margin-bottom:10px">${lleg?'Fotos de cómo está el sitio antes de montar (suelo, paredes, enchufes…). Te cubren si luego hay una reclamación.':'Fotos de cómo dejamos el sitio al recoger.'}</div>`}
    <label class="btn sec2 fotobtn" for="el_${tipo}">＋ Fotos ${lleg?'al llegar':'al irnos'}</label><input type="file" id="el_${tipo}" accept="image/*" multiple hidden data-t="${tipo}" onchange="fotosLugar(this)"></div>`;
}
async function fotosLugar(inp){
  const fs = [...(inp.files||[])].slice(0,9), tipo = inp.dataset.t; if(!fs.length) return;
  S.fotos = S.fotos || [];
  for(const f of fs){ try{ const d = await comprimir(f, 900, 45000); S.fotos.push({ fecha: hora(), material:'Estado del lugar', tipo, img:d }); render(); await enviar('ckFoto', S.num, 'Estado del lugar', tipo, d); }catch(e){ toast(e.message); } }
  toast(fs.length>1 ? fs.length+' fotos guardadas' : 'Foto guardada');
}

/* ---------- 7. LISTO SIN COBERTURA ---------- */
function offHoy(){ try{ const o = JSON.parse(localStorage.getItem('ck_off')||'{}'); return o.dia === fechaISO(Date.now()) ? o.nums || [] : []; }catch(e){ return []; } }
async function prepararOffline(manual){
  const hoy = diaDe(Date.now()), l = (S.presus||[]).filter(p=>p.ts && !p.cerrado && diaDe(p.ts) >= hoy && diaDe(p.ts) <= hoy + 864e5);
  if(!l.length){ if(manual) toast('No tienes bolos hoy ni mañana'); return; }
  if(!manual && offHoy().length >= l.length) return;
  if(manual) toast('Descargando ' + l.length + (l.length>1?' bolos…':' bolo…'));
  const ok = [];
  for(const p of l){
    try{
      const [m] = await Promise.all([call('ckMaterial', p.num), call('ckBolo', p.num), call('ckGastos', p.num)]);
      const nombres = [...new Set((m.items||[]).map(i=>i.material).concat((m.items||[]).map(i=>String(i.material).replace(/\s*\([^)]*\)\s*$/,''))))];
      try{ const r = await call('ckFotosMat', nombres) || {}; Object.keys(r).forEach(k=>FM[k]=r[k]); guardarFM(); }catch(e){}
      ok.push(p.num);
    }catch(e){}
  }
  try{ await cargarScript('jsqr.js'); }catch(e){}
  try{ localStorage.setItem('ck_off', JSON.stringify({ dia: fechaISO(Date.now()), nums: ok })); }catch(e){}
  if(manual) toast(ok.length ? `✓ Listo: ${ok.length} ${ok.length>1?'bolos guardados':'bolo guardado'} para trabajar sin cobertura` : 'Necesitas conexión para descargarlos');
  if(S.vista==='lista' && !$('#sheet').classList.contains('open')) render();
}

/* ---------- 8. RENTABILIDAD EN TIEMPO REAL ---------- */
async function cargarRent(num){
  const p = S.presus.find(x=>x.num===num); if(!p || !p.ts) return;
  const d = new Date(p.ts), mes = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  try{ const r = await call('ckResumen', mes); S.rent = S.rent || {}; S.rent[num] = ((r||{}).rentabilidad||[]).find(x=>x.num===num) || { vacio:true }; if(S.vista==='det' && S.num===num && !$('#sheet').classList.contains('open')) render(); }catch(e){}
}
function tarjetaRentabilidad(){
  if(!esAdmin()) return '';
  const x = (S.rent||{})[S.num];
  if(!x){ if(!tarjetaRentabilidad.pide || tarjetaRentabilidad.pide !== S.num){ tarjetaRentabilidad.pide = S.num; cargarRent(S.num); } return `<div class="furg"><b>${ic('chart','s')} Rentabilidad</b><div class="meta">Calculando…</div></div>`; }
  if(x.vacio) return `<div class="furg"><b>${ic('chart','s')} Rentabilidad</b><div class="meta">Aún no hay importe del presupuesto para este bolo.</div></div>`;
  const pct = Math.max(0, Math.min(100, x.pct));
  return `<div class="furg rentv"><div class="top"><b>${ic('chart','s')} Rentabilidad en tiempo real</b><button class="edit" onclick="S.rent[S.num]=null;tarjetaRentabilidad.pide=null;render()">Actualizar</button></div>
    <div class="rgr"><div><span>Presupuesto</span><b>${eur(x.importe)}</b></div><div><span>Gastado</span><b>${eur(x.real)}</b></div><div class="${x.pct<20?'bajo':x.pct<40?'medio':'bien'}"><span>Margen</span><b>${eur(x.margen)}</b></div></div>
    <div class="rbar"><div style="width:${pct}%" class="${x.pct<20?'bajo':x.pct<40?'medio':'bien'}"></div></div>
    <div class="meta">${x.pct}% de margen${x.horas?' · '+x.horas+' h apuntadas':''}${x.horasSinPrecio?' · hay horas sin €/hora en la pestaña Equipo':''}. Se actualiza con cada gasto, hora y fichaje.</div></div>`;
}

/* ---------- RENDER ---------- */
function render(){ const V = { lista:vistaLista, furgos:vistaFurgos, etiq:vistaEtiquetas, hist:vistaHistorial, accesos:vistaAccesos, resumen:vistaResumen, login:vistaLogin, factura:vistaFactura, rep:vistaRep, mant:vistaMant, plant:vistaPlantillas, copias:vistaCopias, enruta:vistaEnRuta, panel:vistaPanel, qrbolo:vistaQrBolo, mapa:vistaMapa, cal:vistaCalendario, sfotos:vistaSesionFotos, averias:vistaAverias, cobros:vistaCobros, qrkits:vistaQrKits, nodisp:vistaDisponibilidad }; const tabs = S.vista==='lista' || S.vista==='furgos'; if(S.vista!=='det'){ const u = $('#undo'); if(u) u.classList.remove('show'); } document.body.classList.toggle('tabs', tabs); $('#app').innerHTML = (V[S.vista] || vistaDet)() + (tabs ? tabbar() : ''); dot(); pintarRed(); salaAuto(); if(S.vista==='mapa') setTimeout(pintarMapa, 0); }
function abrirSheet(h){ const u = $('#undo'); if(u) u.classList.remove('show'); $('#sheet').innerHTML = h; $('#sbg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('open')); }
window.addEventListener('popstate', ()=>{ if(S.vista!=='lista' && S.vista!=='login'){ S.vista = S.vista==='hist' && S.num ? 'det' : 'lista'; render(); } });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ if(COLA.length) vaciarCola(); if(S.pend || !KEY || SCAN || !['lista','det'].includes(S.vista) || $('#sheet').classList.contains('open')) return; S.vista==='det' ? abrir(S.num,true) : cargarLista(); } });
setInterval(() => {
  if(document.hidden || !KEY || S.pend || SCAN || S.enviando || COLA.length || $('#sheet').classList.contains('open')) return;
  if(S.vista==='lista'){ call('ckPresupuestos').then(l => { if(JSON.stringify(l) !== JSON.stringify(S.presus)){ S.presus = l; if(S.vista==='lista') render(); } }).catch(()=>{}); }
  else if(S.vista==='det' && S.num){ const p0 = S.num; call('ckPresupuestos').then(l => { S.presus = l; }).catch(()=>{}); abrir(p0, 'auto'); }
}, 30000);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).then(reg => { reg.update().catch(()=>{}); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) reg.update().catch(()=>{}); }); }).catch(()=>{});
  let recargado = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if(recargado || COLA.length) return; recargado = true; location.reload(); });
}
setTimeout(ocultarSplash, 5000);
if(!KEY){ S.vista='login'; render(); ocultarSplash(); setTimeout(()=>{ const i=$('#lgCod'); if(i) i.focus(); }, 300); }
else arrancar();
</script>
