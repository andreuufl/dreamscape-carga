<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16243a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carga">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>Carga · Dreamscape</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,460&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--navy:#16243a;--navy2:#22344f;--bg:#f2f4f7;--card:#fff;--txt:#14202e;--mut:#6b7686;--line:#e3e7ec;--ok:#1f9d55;--okbg:#e5f6ec;--dev:#2b6cb0;--devbg:#e6f0fa;--warn:#d97706;--warnbg:#fff4e0;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px}
.brand{display:flex;flex-direction:column;align-items:flex-start;line-height:1;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .bw{font-family:Fraunces,"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:460;letter-spacing:.26em;color:#ece7de;font-size:17px}
.brand .bs{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.3em;color:#c9a66b;font-size:9.5px;margin-top:5px;text-transform:uppercase}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0}
.sub{font-size:13px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:22px;flex:none}
.ref{width:40px;height:40px;border-radius:12px;background:var(--navy2);display:grid;place-items:center;font-size:18px;flex:none}
.search{margin-top:12px;width:100%;padding:12px 14px;border-radius:12px;border:0;font:inherit;font-size:16px;background:#fff}
.seg{display:flex;background:var(--navy2);border-radius:12px;padding:4px;margin-top:12px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;color:#c9d3e0;font-weight:600;font-size:15px}
.seg button.on{background:#fff;color:var(--navy)}
main{padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);display:block;width:100%;text-align:left}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.num{font-weight:700;font-size:15px;color:var(--navy)}
.date{font-size:13px;color:var(--mut);white-space:nowrap}
.ev{margin:4px 0 10px;font-size:15px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar small{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.track{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:9px;background:var(--ok);transition:width .3s}
.fill.dev{background:var(--dev)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--warnbg);color:var(--warn);margin-left:6px}
.prog{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.prog .big{font-size:28px;font-weight:800}
.prog .big span{font-size:16px;color:var(--mut);font-weight:600}
.prog .track{height:10px}
.done-banner{background:var(--okbg);color:var(--ok);font-weight:700;text-align:center;padding:14px;border-radius:var(--r);margin-bottom:12px}
.done-banner.dev{background:var(--devbg);color:var(--dev)}
.sec{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:16px 4px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;min-height:68px;user-select:none;transition:background .15s,transform .1s}
.item:active{transform:scale(.985)}
.chk{width:34px;height:34px;border-radius:10px;border:2.5px solid #c3cad4;flex:none;display:grid;place-items:center;font-size:20px;color:#fff;font-weight:900}
.item.on .chk{background:var(--ok);border-color:var(--ok)}
.mode-dev .item.on .chk{background:var(--dev);border-color:var(--dev)}
.item.on{background:#fafbfc}
.item.on .mat{color:var(--mut);text-decoration:line-through}
.qty{flex:none;min-width:48px;height:40px;padding:0 8px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px}
.info{flex:1;min-width:0}
.mat{font-weight:600;font-size:16px;word-break:break-word}
.meta{font-size:12.5px;color:var(--mut);margin-top:2px}
.meta .inc{color:var(--warn);font-weight:600}
.more{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--mut)}
.item.has-inc .more{color:var(--warn);background:var(--warnbg)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 30%);z-index:4}
.btn{width:100%;padding:16px;border-radius:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
.btn.sec2{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:21;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h3{margin:0 0 4px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:10px 14px;border-radius:24px;background:var(--bg);font-weight:600;font-size:15px}
.chip.on{background:var(--warn);color:#fff}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#1b2633;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty,.loading{text-align:center;color:var(--mut);padding:40px 10px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.sync{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block;margin-left:6px;vertical-align:middle}
.sync.busy{background:#fbbf24}
.steps{display:flex;align-items:center;margin-top:12px;gap:4px}
.step{flex:none;display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:12px;color:#aebbd0;font-weight:600;font-size:14px}
.step .n{width:24px;height:24px;border-radius:50%;border:2px solid #4b5f7d;display:grid;place-items:center;font-size:13px;font-weight:800}
.step.on{background:#fff;color:var(--navy)}
.step.on .n{border-color:var(--navy);background:var(--navy);color:#fff}
.step.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .ln{flex:1;height:2px;background:#33486a;min-width:6px}
.dest{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:12px}
.dest .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.dest .place{font-size:21px;font-weight:800;margin:6px 0 4px;word-break:break-word}
.dest .when{color:var(--mut);font-size:14px}
.maps{display:grid;gap:10px;margin-bottom:12px}
.mapbtn{display:flex;align-items:center;gap:12px;padding:16px;border-radius:14px;background:var(--card);font-weight:700;font-size:16px;color:var(--txt);text-decoration:none}
.mapbtn.main{background:var(--dev);color:#fff}
.mapbtn .ic{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:19px;flex:none}
.mapbtn.main .ic{background:rgba(255,255,255,.18)}
.mapbtn .go{margin-left:auto;opacity:.6;font-size:20px}
.aviso{background:var(--warnbg);color:var(--warn);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;margin-bottom:12px}
.furg{background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.furg .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.furg .mat{font-size:20px;font-weight:800;letter-spacing:.06em;text-decoration:none!important;color:var(--txt)!important}
.plate{display:inline-block;border:2px solid var(--txt);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:.08em;font-size:18px;background:#fff;color:#14202e}
.plate::before{content:"E";display:inline-block;background:#1e4fb5;color:#fff;font-size:11px;padding:2px 4px;margin:-2px 8px -2px -10px;border-radius:3px 0 0 3px;vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600;word-break:break-word}
.edit{font-size:14px;font-weight:700;color:var(--dev);padding:6px 10px;border-radius:10px;background:var(--devbg)}
.salida{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:16px;background:var(--ok);color:#fff;font-weight:800;font-size:17px;margin-bottom:12px}
.salida.sent{background:var(--okbg);color:var(--ok)}
.salida[disabled]{opacity:.7}
.fld{display:block;margin-bottom:10px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;margin:0;min-height:0;background:#fff;color:var(--txt)}
.sheet{max-height:88vh;overflow:auto}
.scan{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;background:var(--card);border:1.5px dashed #b9c3d0;font-weight:700;font-size:15px;margin-bottom:12px;color:var(--navy)}
.scan .ic{font-size:20px}
.scanov{position:fixed;inset:0;background:#000;z-index:50}
.scanov video{width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:50%;top:45%;width:64vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.scantop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;color:#fff}
.scantop button{background:rgba(255,255,255,.18);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700}
.scanlast{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 24px);background:rgba(20,32,46,.92);color:#fff;padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:16px}
.scanlast.good{background:var(--ok)}.scanlast.bad{background:#c0392b}
.contact{display:flex;align-items:center;justify-content:space-between;gap:12px}
.contact .lbl{font-size:12px;color:var(--mut);font-weight:600}
.call{flex:none;background:var(--ok);color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:12px}
.hito{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);margin-bottom:10px;text-align:left}
.hito .ic{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.hito b{display:block;font-size:17px}.hito small{color:var(--mut);font-size:13px}
.hito.ok .ic{background:var(--ok);color:#fff;font-weight:900}
.salida.firma{background:var(--navy)}
.pad{position:relative;height:190px;border:1.5px dashed #b9c3d0;border-radius:14px;background:#fff;margin-bottom:4px;touch-action:none}
.pad canvas{width:100%;height:100%;display:block;border-radius:14px;touch-action:none}
.padhint{position:absolute;inset:0;display:grid;place-items:center;color:#a0aab8;pointer-events:none;font-weight:600}
.selfurgo{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--txt)}
.frow{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.plate.sm{font-size:15px;margin-bottom:4px}
.danger{color:#c0392b!important}
.fotobtn{display:block;text-align:center;margin-top:10px}
.prev{width:100%;border-radius:12px;display:block;max-height:260px;object-fit:cover}
.card.alerta{background:var(--warnbg);color:var(--warn);border:1.5px solid #f3c98b}
.card.alerta .meta{color:#9a5b06}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.label{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;break-inside:avoid;color:#14202e}
.label .qr{width:64px;height:64px;flex:none}.label .qr svg{width:100%;height:100%}
.label .lt{min-width:0;display:flex;flex-direction:column;gap:2px}
.label b{font-size:12px;line-height:1.2;overflow-wrap:break-word;hyphens:auto}.label small{font-size:11px;color:#6b7686}
.label span{font-family:Fraunces,Georgia,serif;letter-spacing:.2em;font-size:8px;color:#a8844a}
@media (max-width:520px){ .step:not(.on) .t{display:none} .step{padding:8px} }
@media print{ .noprint,.toast,.foot{display:none!important} body{background:#fff} main.etiq{padding:0} .labels{grid-template-columns:repeat(3,1fr)} .sec{margin-top:8px} }
.redbar{position:fixed;left:0;right:0;top:0;z-index:40;background:#b45309;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px max(24px,env(safe-area-inset-left));background:var(--navy);color:#fff}
.login .brand.big .bw{font-size:26px}.login .brand.big{border:0;margin-bottom:28px}
.login h1{font-size:26px;margin:0 0 6px}.login p{opacity:.75;margin:0 0 20px}
.login input{width:100%;padding:16px;border-radius:14px;border:0;font:inherit;font-size:18px;margin-bottom:12px;background:#fff;color:#14202e}
.login .btn{background:#c9a66b;color:#16243a}.login .meta{color:#fca5a5;margin-top:10px}
.mitem{width:100%;display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left}
.mitem .ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.mitem b{display:block;font-size:16px}.mitem small{color:var(--mut);font-size:13px}
.pasos{padding-left:20px;line-height:1.6}.sel{user-select:all;-webkit-user-select:all;font-family:ui-monospace,Menlo,monospace}
.hoy{background:var(--navy);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px}
.hoy.man{background:var(--navy2)}
.hoy .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:#c9a66b}
.hoy .hev{font-size:20px;font-weight:800;margin:6px 0 4px}.hoy .hlug{opacity:.85;font-size:14px}
.hoy .hst{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;opacity:.85;margin:10px 0 12px}
.hoy .btn{background:#c9a66b;color:#16243a}
.mapbtn.avisa{width:100%;margin-bottom:12px;text-align:left}
.btn.wa{background:#25d366;color:#fff;text-align:center;text-decoration:none;display:block}
a.btn{display:block;text-align:center;text-decoration:none}
.ck{width:100%;display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);text-align:left}
.ck .cb{width:26px;height:26px;border-radius:8px;border:2px solid #c3cad4;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.ck.on .cb{background:var(--ok);border-color:var(--ok)}.ck b{font-weight:600;font-size:15px}.ck.on b{color:var(--mut)}
.ck small{display:block;color:var(--mut);font-size:12px}
.grow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gimp{text-align:right;font-size:13px;color:var(--mut);display:flex;flex-direction:column}.gimp b{color:var(--txt);font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.fgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:14px;padding:14px}.tile b{display:block;font-size:22px;font-weight:800}.tile span{color:var(--mut);font-size:13px}
.tile.warn b{color:var(--warn)}
.hrow2{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
main > .hrow2{background:var(--card);padding:12px 14px;border-radius:12px;margin-bottom:8px;border:0}
.bar2{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:14px;margin-bottom:8px}
.bar2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bt div{height:100%;background:var(--dev);border-radius:6px}
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--navy2);border-radius:12px;padding:4px}
.mesnav button{width:44px;height:40px;border-radius:9px;color:#fff;font-size:22px}.mesnav b{}
.sw{padding:8px 12px;border-radius:20px;background:var(--bg);font-weight:700;font-size:13px;color:var(--mut)}
.sw.on{background:var(--okbg);color:var(--ok)}
.codigo{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:17px}
.codigo select{border:0;background:transparent;font:inherit;font-size:14px;color:var(--txt)}
.card.alerta.azul{background:var(--devbg);color:var(--dev);border-color:#b7d0ee}.card.alerta.azul .meta{color:#2c5282}
.cerrado{background:var(--okbg);border:1.5px solid #a7dfbd;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;color:var(--ok)}
.cerrado .meta{color:#2f7a4f}
.tot>div{display:flex;justify-content:space-between;padding:4px 0}.tot span{color:var(--mut)}.tot .big2 b{font-size:20px}
.mant.venc{border-left:4px solid #c0392b}.mant.pronto{border-left:4px solid var(--warn)}
.when2{font-size:13px;font-weight:700;white-space:nowrap;color:var(--mut)}.mant.venc .when2{color:#c0392b}.mant.pronto .when2{color:var(--warn)}
.rent{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pct{font-size:20px;font-weight:800;color:var(--ok);text-align:right;flex:none}.pct small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.pct.medio{color:var(--warn)}.pct.bajo{color:#c0392b}
.item.extra{min-height:56px;background:#fbfaf7}.item.extra.on{background:#f6f7f8}
.qty.sm{font-size:13px;min-width:44px;height:34px;font-weight:700}
.scan.addx{border-style:solid;border-color:var(--line);color:var(--mut);font-weight:600;margin-top:4px}
.sec.sl{display:flex;justify-content:space-between;align-items:center}.sec.sl button{font-size:12px;font-weight:700;color:var(--dev);text-transform:none;letter-spacing:0}
.inp{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:16px;background:#fff;color:var(--txt)}
a.copia{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--txt)}a.copia span{color:var(--dev);font-weight:700}
.link{display:block;width:100%;text-align:center;padding:12px;color:var(--mut);font-weight:600;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sbg" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// La clave llega en el enlace (#k=...) y se guarda en este móvil
let KEY = '';
try{ const m = location.hash.match(/k=([\w-]+)/); if(m){ localStorage.setItem('ck_key', m[1]); history.replaceState(null,'',location.pathname); } KEY = localStorage.getItem('ck_key') || ''; }catch(e){ const m = location.hash.match(/k=([\w-]+)/); KEY = m ? m[1] : ''; }
const S = { vista:'lista', filtro:'prox', q:'', presus:[], num:null, items:[], opciones:[], modo:'carga', pend:0, furgos:[], bolo:null, pendientes:[], catalogo:null, enviando:false };
let SALIDAS = {}; try{ SALIDAS = JSON.parse(localStorage.getItem('ck_salidas')||'{}'); }catch(e){}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vib = n => { try{ navigator.vibrate && navigator.vibrate(n) }catch(e){} };

const API = 'https://script.google.com/macros/s/AKfycbwEQlNLMpsPbUDbgc3p12dKbyeVm17cIY_-XH3YmIzadhPqSUu12ZoHwxZ4xAfff45-/exec';
async function call(fn, ...args){
  S.pend++; dot();
  try{
    const u = API + '?k=' + encodeURIComponent(KEY) + '&a=' + fn + '&p=' + encodeURIComponent(JSON.stringify(args)) + '&t=' + Date.now();
    let j;
    try{ const r = await fetch(u, { credentials: 'omit', cache: 'no-store' }); j = await r.json(); }
    catch(e){ const ck = LECT.includes(fn) ? cacheGet(fn+JSON.stringify(args)) : undefined; if(ck !== undefined){ S.offline = true; pintarRed(); return ck; } const er = new Error('Sin conexión'); er.red = true; throw er; }
    if(!j.ok) throw new Error(j.e || 'Error');
    if(LECT.includes(fn)) cacheSet(fn+JSON.stringify(args), j.r);
    if(S.offline){ S.offline = false; pintarRed(); }
    return j.r;
  }finally{ S.pend--; dot(); }
}
async function callPost(fn, ...args){
  S.pend++; dot();
  try{
    let j;
    try{ const r = await fetch(API, { method:'POST', body: JSON.stringify({ k:KEY, a:fn, p:args }), credentials:'omit' }); j = await r.json(); }
    catch(e){ const er = new Error('Sin conexión'); er.red = true; throw er; }
    if(!j.ok) throw new Error(j.e || 'Error');
    return j.r;
  }
  finally{ S.pend--; dot(); }
}
function dot(){ const d = $('#dot'); if(d) d.className = 'sync' + (S.pend ? ' busy' : ''); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------- LISTA ---------- */
async function cargarLista(){
  S.vista='lista'; S.num=null; render();
  try{ S.presus = await call('ckPresupuestos'); }catch(e){ toast('Error: '+e.message); }
  if(S.vista==='lista') render();
  cargarAvisos();
}
function filtrados(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const lim = hoy.getTime() - 3*864e5;
  let l = S.presus.slice();
  if(S.filtro==='prox') l = l.filter(p => !p.ts || p.ts >= lim || p.cargados > p.devueltos);
  if(S.q){ const q=S.q.toLowerCase(); l = l.filter(p => (p.num+' '+p.evento).toLowerCase().includes(q)); }
  l.sort((a,b)=> S.filtro==='prox' ? (a.ts||9e15)-(b.ts||9e15) : (b.ts||0)-(a.ts||0));
  return l;
}
function vistaLista(){
  const l = filtrados();
  const body = !S.presus.length ? `<div class="loading"><div class="spin"></div>Cargando presupuestos…</div>`
    : !l.length ? `<div class="empty">No hay presupuestos ${S.filtro==='prox'?'próximos':''}</div>`
    : l.map(p => {
      const pc = p.total ? p.cargados/p.total*100 : 0, pd = p.total ? p.devueltos/p.total*100 : 0;
      return `<button class="card" onclick="abrir('${esc(p.num)}')">
        <div class="top"><span class="num">${esc(p.num)}${p.incidencias?`<span class="tag">⚠ ${p.incidencias}</span>`:''}</span><span class="date">${esc(p.montaje)}</span></div>
        <div class="ev">${esc(p.evento)}</div>
        <div class="bars">
          <div class="bar"><small><span>🚚 Carga</span><b>${p.cargados}/${p.total}</b></small><div class="track"><div class="fill" style="width:${pc}%"></div></div></div>
          <div class="bar"><small><span>🏠 Vuelta</span><b>${p.devueltos}/${p.total}</b></small><div class="track"><div class="fill dev" style="width:${pd}%"></div></div></div>
        </div></button>`;
    }).join('');
  const pendHtml = (S.pendientes||[]).map(x=>`<button class="card alerta" onclick="abrir('${esc(x.num)}')"><b>⚠ Material sin devolver</b><div class="meta">${esc(x.num)} · ${esc(x.evento)} · ${x.n} artículos</div></button>`).join('');
  return `<header>
    <div class="brand" aria-label="Dreamscape Events & Productions"><span class="bw">DREAMSCAPE</span><span class="bs">Events &amp; Productions</span></div>
    <div class="hrow"><h1>${esc(((S.yo||{}).usuario||{}).rol==='tecnico' ? 'Hola, '+S.yo.usuario.nombre : 'Carga de material')}<span class="sync" id="dot"></span></h1><button class="ref" onclick="abrirMenu()" aria-label="Menú">☰</button><button class="ref" onclick="cargarLista()" aria-label="Actualizar">↻</button></div>
    <input class="search" placeholder="Buscar nº o cliente…" value="${esc(S.q)}" oninput="S.q=this.value;redibujarLista()">
    <div class="seg"><button class="${S.filtro==='prox'?'on':''}" onclick="S.filtro='prox';render()">Próximos</button><button class="${S.filtro==='todos'?'on':''}" onclick="S.filtro='todos';render()">Todos</button></div>
  </header><main id="lista">${tarjetasHoy()}${pendHtml}${tarjetasAvisos()}${body}</main>`;
}
function redibujarLista(){ const m=document.createElement('div'); m.innerHTML=vistaLista(); $('#lista').innerHTML=m.querySelector('#lista').innerHTML; }

/* ---------- DETALLE ---------- */
async function abrir(num, refresco){
  const nuevo = !refresco; S.vista='det'; S.num=num; if(nuevo){ const cm = cacheGet('ckMaterial'+JSON.stringify([num])); S.items = cm ? cm.items : []; S.opciones = cm ? cm.opciones : []; S.bolo = cacheGet('ckBolo'+JSON.stringify([num])) || null; S.gastos = cacheGet('ckGastos'+JSON.stringify([num])) || []; S.fotos = null; }
  const p = S.presus.find(x=>x.num===num);
  if(nuevo){
    const f = (S.bolo||{}).ficha || {};
    S.modo = !p || !p.total || p.cargados<p.total ? 'carga' : (p.devueltos>0 ? 'dev' : 'ruta');
  }
  if(nuevo){ try{history.pushState({v:'det'},'')}catch(e){} render(); window.scrollTo(0,0); }
  if(COLA.length){ await vaciarCola(); }
  const [rm, rb, rg] = await Promise.allSettled([call('ckMaterial', num), call('ckBolo', num), call('ckGastos', num)]);
  if(rg.status==='fulfilled') S.gastos = rg.value || [];
  if(rm.status==='fulfilled'){ if(!COLA.length){ S.items=rm.value.items; S.opciones=rm.value.opciones; } actualizarResumen(); } else if(!S.items.length) toast('Error: '+rm.reason.message);
  if(rb.status==='fulfilled'){
    S.bolo = rb.value; S.furgos = rb.value.furgonetas || [];
    const f = S.bolo.ficha||{};
    if(nuevo && S.modo==='ruta' && (f.llegada || SALIDAS[num])) S.modo='montaje';
  }
  if(S.vista==='det' && S.num===num) render();
}
function ficha(){ return (S.bolo && S.bolo.ficha) || {}; }
function vistaDet(){
  const p = S.presus.find(x=>x.num===S.num) || {num:S.num, evento:''};
  const lista = S.modo==='carga' || S.modo==='dev';
  const k = S.modo==='carga' ? 'cargado' : 'devuelto';
  const hk = S.modo==='carga' ? 'hCarga' : 'hDev';
  const tot = S.items.length, hechos = S.items.filter(i=>i[k]).length;
  const pend = S.items.filter(i=>!i[k]), ok = S.items.filter(i=>i[k]);
  let foot0 = null;
  const fila = i => `<div class="item ${i[k]?'on':''} ${i.incidencia?'has-inc':''}" id="it${i.fila}" onclick="toggle(${i.fila})">
      <div class="chk">${i[k]?'✓':''}</div>
      <div class="qty">${esc(i.cant)}</div>
      <div class="info"><div class="mat">${esc(i.material)}</div>
        <div class="meta">${[i[k]&&i[hk]?(S.modo==='carga'?'Cargado ':'Devuelto ')+esc(i[hk]):'', S.modo==='dev'&&!i.cargado?'No marcado en carga':'', i.incidencia?`<span class="inc">⚠ ${esc(i.incidencia)}${i.nota?': '+esc(i.nota):''}</span>`:'', i.stock && S.modo==='carga' && !i.cargado?`<span class="inc">⚠ Stock: ${i.stock.usado} de ${i.stock.stock}${i.stock.otros.length?' · también en '+esc(i.stock.otros.join(', ')):''}</span>`:''].filter(Boolean).join(' · ')}</div></div>
      <button class="more" onclick="event.stopPropagation();abrirInc(${i.fila})" aria-label="Incidencia">⚠︎</button>
    </div>`;
  let body;
  if(!tot) body = `<div class="loading"><div class="spin"></div>Cargando material…</div>`;
  else if(S.modo==='ruta'){ const r = vistaRuta(p, tot); body = r.body; foot0 = r.foot; }
  else if(S.modo==='montaje'){ const r = vistaMontaje(p, tot); body = r.body; foot0 = r.foot; }
  else {
    const f = ficha();
    body = `
    <div class="prog"><div class="big">${hechos}<span> / ${tot} ${S.modo==='carga'?'cargados':'devueltos'}</span></div>
      <div class="track"><div class="fill ${S.modo==='dev'?'dev':''}" style="width:${hechos/tot*100}%"></div></div></div>
    <button class="scan" onclick="abrirScan()"><span class="ic">⌗</span>Escanear código QR del material</button>
    ${hechos===tot?`<div class="done-banner ${S.modo==='dev'?'dev':''}">${S.modo==='carga'?'✓ Todo cargado en la furgoneta':'✓ Todo devuelto al almacén'}</div>`:''}
    ${S.modo==='dev' && f.vuelta?`<div class="done-banner dev" style="font-weight:600">Resumen de vuelta enviado ${esc(f.vuelta)}</div>`:''}
    ${S.modo==='dev' && f.cerrado?`<div class="cerrado"><b>✅ Listo para facturar</b><div class="meta">Firmado y todo devuelto · ${esc(f.cerrado)}</div><div class="row2" style="margin-top:10px">${esAdmin()?'<button class="btn" onclick="verFactura()">🧾 Datos factura</button>':''}<button class="btn sec2" onclick="pedirValoracion()">⭐ Pedir valoración</button></div></div>`:''}
    ${S.modo==='dev' ? (f.recogida ? `<div class="done-banner">✍ Recogida firmada por ${esc(f.recogida.nombre)} · ${esc(f.recogida.hora)}</div>` : `<button class="salida firma" onclick="abrirFirma('recogida')">✍ Firma de recogida del cliente</button>`) : ''}
    ${pend.length?`<div class="sec">Pendiente (${pend.length})</div>${pend.map(fila).join('')}`:''}
    ${ok.length?`<div class="sec">${S.modo==='carga'?'En la furgoneta':'En el almacén'} (${ok.length})</div>${ok.map(fila).join('')}`:''}
    ${bloqueExtras()}`;
  }
  const faltan = tot - hechos;
  const foot = foot0 !== null ? foot0 : !tot ? '' : S.modo==='carga'
    ? `<div class="foot"><div class="row2"><button class="btn sec2" onclick="todo(${hechos!==tot})">${hechos===tot?'Desmarcar todo':'Marcar todo'}</button><button class="btn" onclick="irA('ruta', ${faltan})">Siguiente →</button></div></div>`
    : `<div class="foot"><div class="row2"><button class="btn sec2" onclick="todo(${hechos!==tot})">${hechos===tot?'Desmarcar todo':'Marcar todo'}</button><button class="btn" ${S.enviando?'disabled':''} onclick="vuelta()">${S.enviando?'Enviando…':(ficha().vuelta?'Reenviar resumen':'Terminar y enviar')}</button></div></div>`;
  return `<header>
    <div class="brand" aria-label="Dreamscape Events & Productions"><span class="bw">DREAMSCAPE</span><span class="bs">Events &amp; Productions</span></div>
    <div class="hrow"><button class="back" onclick="S.vista='lista';render()" aria-label="Volver">‹</button>
      <div style="flex:1;min-width:0"><h1>${esc(p.num)}<span class="sync" id="dot"></span></h1><div class="sub">${esc(p.evento)}${p.montaje?' · '+esc(p.montaje):''}</div></div>
      <button class="ref" onclick="abrirMas()" aria-label="Más opciones del bolo">⋯</button>
      <button class="ref" onclick="abrir(S.num,true)" aria-label="Actualizar">↻</button></div>
    ${tot ? stepper(tot) : ''}
  </header><main class="${S.modo==='dev'?'mode-dev':''}">${body}</main>${foot}`;
}
function stepper(tot){
  const c = S.items.filter(i=>i.cargado).length, d = S.items.filter(i=>i.devuelto).length, f = ficha();
  const ok = { carga: c===tot, ruta: !!(SALIDAS[S.num] || f.salida), montaje: !!(f.finMontaje || f.firma), dev: d===tot };
  const pasos = [['carga','1','Cargar'],['ruta','2','Ruta'],['montaje','3','Montaje'],['dev','4','Vuelta']];
  return `<div class="steps">${pasos.map(([m,n,t])=>`<button class="step ${S.modo===m?'on':''} ${ok[m]?'ok':''}" onclick="irA('${m}')"><span class="n">${ok[m]?'✓':n}</span><span class="t">${t}</span></button>`).join('<span class="ln"></span>')}</div>`;
}
function irA(m, faltan){
  if(faltan && !confirm(`Faltan ${faltan} artículos por cargar. ¿Pasar a la ruta igualmente?`)) return;
  S.modo = m; render(); window.scrollTo(0,0);
}
function destino(l){ return String(l||'').replace(/["“”«»]/g,'').replace(/\s*\|\s*/g,', ').trim(); }
function tel(t){ return String(t||'').replace(/[^\d+]/g,''); }

/* Tarjeta resumen de la ficha (contacto, horarios, acceso, técnicos) */
function tarjetaFicha(){
  const f = ficha();
  const tecs = (f.tecnicos||[]);
  const filas = [
    f.horario ? `<dt>Horario</dt><dd>${esc(f.horario)}</dd>` : '',
    f.acceso ? `<dt>Acceso</dt><dd>${esc(f.acceso)}</dd>` : '',
    f.notas ? `<dt>Notas</dt><dd>${esc(f.notas)}</dd>` : '',
    tecs.length ? `<dt>Técnicos</dt><dd>${esc(tecs.join(', '))}</dd>` : ''
  ].join('');
  const contacto = f.contacto || f.telefono
    ? `<div class="contact"><div><div class="lbl">Contacto en el lugar</div><b>${esc(f.contacto||'Sin nombre')}</b>${f.telefono?`<div class="meta">${esc(f.telefono)}</div>`:''}</div>${f.telefono?`<a class="call" href="tel:${esc(tel(f.telefono))}">📞 Llamar</a>`:''}</div>` : '';
  if(!contacto && !filas) return `<div class="furg"><div class="top"><b>Ficha del bolo</b><button class="edit" onclick="abrirFicha()">Rellenar</button></div><div class="meta">Contacto en el lugar, horarios, acceso y técnicos.</div></div>`;
  return `<div class="furg"><div class="top"><b>Ficha del bolo</b><button class="edit" onclick="abrirFicha()">Editar</button></div>${contacto}${filas?`<dl class="kv" style="margin:10px 0 0">${filas}</dl>`:''}</div>`;
}

function vistaRuta(p, tot){
  const c = S.items.filter(i=>i.cargado).length;
  const q = encodeURIComponent(destino(p.lugar));
  const aviso = c<tot ? `<div class="aviso">⚠ Faltan ${tot-c} artículos por cargar</div>` : '';
  const dest = !p.lugar
    ? `<div class="dest"><div class="lbl">Destino</div><div class="place">Sin lugar</div><div class="when">Este bolo no tiene el lugar rellenado en la pestaña Bolos.</div></div>`
    : `<div class="dest"><div class="lbl">Destino</div><div class="place">${esc(p.lugar)}</div><div class="when">Montaje ${esc(p.montaje)}${p.desmontaje&&p.desmontaje!==p.montaje?' · Desmontaje '+esc(p.desmontaje):''}</div></div>`;
  const mapas = !p.lugar ? '' : `<div class="maps">
        <a class="mapbtn main" onclick="salidaAuto()" href="https://maps.apple.com/?daddr=${q}&dirflg=d" target="_blank" rel="noopener"><span class="ic">🧭</span>Abrir en Mapas<span class="go">›</span></a>
        <a class="mapbtn" onclick="salidaAuto()" href="https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=driving" target="_blank" rel="noopener"><span class="ic">📍</span>Google Maps<span class="go">›</span></a>
        <a class="mapbtn" onclick="salidaAuto()" href="https://waze.com/ul?q=${q}&navigate=yes" target="_blank" rel="noopener"><span class="ic">🚐</span>Waze<span class="go">›</span></a>
      </div>
      <button class="link" onclick="copiar('${esc(destino(p.lugar)).replace(/'/g,"\\'")}')">Copiar dirección</button>`;
  const body = `${aviso}${dest}${tarjetaFurg()}${tarjetaFoto()}${btnSalida(p)}${mapas}<button class="mapbtn avisa" onclick="abrirAviso()"><span class="ic">📲</span>Avisar al cliente de la llegada<span class="go">›</span></button>${tarjetaFicha()}`;
  const foot = `<div class="foot"><button class="btn" onclick="irA('montaje')">Siguiente: montaje →</button></div>`;
  return { body, foot };
}
function btnSalida(p){
  const h = SALIDAS[p.num] || ficha().salida;
  if(S.enviando) return `<button class="salida" disabled>Enviando correo…</button>`;
  if(h) return `<button class="salida sent" onclick="salida(true)">✓ Salida avisada ${esc(h)} · Reenviar</button>`;
  return `<button class="salida" onclick="salida()">🚐 Me dirijo al lugar</button>`;
}

/* ---------- FURGONETAS ---------- */
function furgoActual(){
  const l = S.furgos||[], id = ficha().furgo;
  return l.find(f=>f.id===id) || (l.length===1 ? l[0] : null);
}
function tarjetaFurg(){
  const l = S.furgos||[], f = furgoActual();
  if(!l.length) return `<div class="furg"><div class="top"><b>Furgoneta</b>${esAdmin()?'<button class="edit" onclick="abrirFurgos()">Añadir</button>':''}</div><div class="meta">Pon la matrícula, marca y modelo para que salgan en el correo.</div></div>`;
  const sel = l.length>1 ? `<select class="selfurgo" id="selfurgo" onchange="elegirFurgo(this.value)"><option value="">Elige furgoneta…</option>${l.map(x=>`<option value="${esc(x.id)}" ${f&&f.id===x.id?'selected':''}>${esc([x.matricula,x.marca,x.modelo].filter(Boolean).join(' · '))}</option>`).join('')}</select>` : '';
  if(!f) return `<div class="furg"><div class="top"><b>Furgoneta</b>${esAdmin()?'<button class="edit" onclick="abrirFurgos()">Gestionar</button>':''}</div>${sel}</div>`;
  const kv = [['Marca',f.marca],['Modelo',f.modelo],['Color',f.color],['Conductor',f.conductor],['Notas',f.notas]].filter(x=>x[1]).map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('');
  return `<div class="furg"><div class="top">${f.matricula?`<span class="plate">${esc(f.matricula)}</span>`:'<b>Furgoneta</b>'}${esAdmin()?'<button class="edit" onclick="abrirFurgos()">Gestionar</button>':''}</div>${sel}<dl class="kv" style="margin:${sel?'10px':'0'} 0 0">${kv}</dl></div>`;
}
async function elegirFurgo(id){
  if(!S.bolo) return; S.bolo.ficha.furgo = id; render();
  guardarBoloCache();
  try{ const r = await enviar('ckGuardarFicha', S.num, { furgo:id }); if(r!==null) toast('Furgoneta asignada'); }catch(e){ toast('No se guardó: '+e.message); }
}
async function cargarFurgos(){ try{ S.furgos = await call('ckFurgonetas') || []; }catch(e){} }
function abrirFurgos(){
  const l = S.furgos||[];
  abrirSheet(`<h3>🚐 Furgonetas</h3><div class="meta" style="margin-bottom:12px">Salen en la app y en el correo de salida.</div>
    ${l.length? l.map((f,i)=>`<div class="frow"><div style="flex:1;min-width:0">${f.matricula?`<span class="plate sm">${esc(f.matricula)}</span>`:''}<div class="meta">${esc([f.marca,f.modelo,f.color].filter(Boolean).join(' · ')||'Sin datos')}</div></div>${esAdmin()?`<button class="edit" onclick="editarFurgo(${i})">Editar</button>`:''}</div>`).join('') : '<div class="meta" style="margin-bottom:12px">Aún no hay ninguna furgoneta.</div>'}
    <div class="row2" style="margin-top:12px"><button class="btn sec2" onclick="cerrarSheet()">Cerrar</button>${esAdmin()?'<button class="btn" onclick="editarFurgo(-1)">+ Añadir</button>':''}</div>`);
}
function editarFurgo(i){
  const f = i>=0 ? S.furgos[i] : {};
  const campo = (id, t, ph) => `<label class="fld"><span>${t}</span><input id="f_${id}" value="${esc(f[id])}" placeholder="${ph}" autocomplete="off"></label>`;
  abrirSheet(`<h3>${i>=0?'Editar furgoneta':'Nueva furgoneta'}</h3>
    ${campo('matricula','Matrícula','1234 ABC')}
    <div class="row2">${campo('marca','Marca','Ej. Renault')}${campo('modelo','Modelo','Ej. Master L3H2')}</div>
    <div class="row2">${campo('color','Color','Blanca')}${campo('conductor','Conductor habitual','Nombre')}</div>
    <label class="fld"><span>Notas (ITV, seguro, gasoil, llaves…)</span><textarea id="f_notas" rows="3">${esc(f.notas)}</textarea></label>

    <div class="pad"><canvas id="pad"></canvas><span class="padhint">Firma aquí con el dedo</span></div>

function initPad(){
  const c = $('#pad'); if(!c) return;
  const r = c.getBoundingClientRect(), dpr = window.devicePixelRatio||1;
  c.width = r.width*dpr; c.height = r.height*dpr;
  const x = c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth = 2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#14202e';
  firmaTrazo = false; let dib = false;
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  c.onpointerdown = e => { dib = true; c.setPointerCapture(e.pointerId); const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); e.preventDefault(); };
  c.onpointermove = e => { if(!dib) return; const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); if(!firmaTrazo){ firmaTrazo=true; const h=document.querySelector('.padhint'); if(h) h.hidden=true; } e.preventDefault(); };
  c.onpointerup = c.onpointercancel = () => { dib = false; };
}
function limpiarFirma(){ initPad(); const h=document.querySelector('.padhint'); if(h) h.hidden=false; }
async function enviarFirma(){
  const nom = ($('#fNom').value||'').trim(), dni = ($('#fDni').value||'').trim();
  if(!nom){ toast('Escribe el nombre de quien firma'); return; }
  if(!firmaTrazo){ toast('Falta la firma'); return; }
  const c = $('#pad'), w = document.createElement('canvas'); w.width = c.width; w.height = c.height;
  const x = w.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w.width,w.height); x.drawImage(c,0,0);
  let png = ''; for(const q of [.6,.45,.3]){ const s2 = document.createElement('canvas'); const r2 = Math.min(1, 700/w.width); s2.width = Math.round(w.width*r2); s2.height = Math.round(w.height*r2); s2.getContext('2d').drawImage(w,0,0,s2.width,s2.height); png = s2.toDataURL('image/jpeg', q); if(png.length < 45000) break; }
  const b = $('#btnFirmar'); b.disabled = true; b.textContent = 'Enviando…';
  try{
    if(FIRMA_TIPO === 'recogida'){ const obs = (($('#fObs')||{}).value||'').trim(); const h = await enviar('ckFirmaRecogida', S.num, nom, dni, obs, png); if(S.bolo){ S.bolo.ficha.recogida = { nombre:nom, hora: h || hora() }; guardarBoloCache(); } cerrarSheet(); vib(30); toast('Recogida firmada y enviada'); render(); return; }
    const h = await enviar('ckFirma', S.num, nom, dni, png); if(S.bolo){ S.bolo.ficha.firma = nom; S.bolo.ficha.firmaHora = h || hora(); guardarBoloCache(); } cerrarSheet(); vib(30); toast('Albarán firmado y enviado'); render(); }
  catch(e){ b.disabled = false; b.textContent = 'Firmar y enviar'; toast('No se envió: '+e.message); }

/* ---------- ESCÁNER QR ---------- */
let SCAN = null, SCANMODO = 'carga';
function cargarScript(src){ return new Promise((ok,ko)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>ko(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
async function abrirScan(modoScan){
  SCANMODO = modoScan || S.modo;
  const ov = document.createElement('div'); ov.className='scanov'; ov.id='scanov';
  ov.innerHTML = `<video id="scanv" playsinline muted></video><div class="scanframe"></div>
    <div class="scantop"><b>${SCANMODO==='consulta'?'Consultar equipo':SCANMODO==='carga'?'Cargar escaneando':'Devolver escaneando'}</b><button onclick="cerrarScan()">Cerrar</button></div>
    <div class="scanlast" id="scanlast">Apunta al código QR de la etiqueta</div>`;
  document.body.appendChild(ov);
  try{
    await cargarScript('jsqr.js');
    const st = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false });
    const v = $('#scanv'); v.srcObject = st; await v.play();
    const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently:true });
    SCAN = { st, ultimo:'', t:0, on:true };
    const loop = () => {
      if(!SCAN || !SCAN.on) return;
      if(v.readyState === v.HAVE_ENOUGH_DATA){
        const w = 480, h = Math.round(v.videoHeight * w / v.videoWidth); c.width = w; c.height = h;
        x.drawImage(v, 0, 0, w, h);
        const r = jsQR(x.getImageData(0,0,w,h).data, w, h, { inversionAttempts:'dontInvert' });
        if(r && r.data && (r.data !== SCAN.ultimo || Date.now()-SCAN.t > 2500)){ SCAN.ultimo = r.data; SCAN.t = Date.now(); leido(r.data); }
      }
      requestAnimationFrame(loop);
    };
    loop();
  }catch(e){ $('#scanlast').textContent = 'No se pudo abrir la cámara. Permite el acceso a la cámara en Safari.'; }
}
function cerrarScan(){ if(SCAN){ SCAN.on=false; try{ SCAN.st.getTracks().forEach(t=>t.stop()); }catch(e){} SCAN=null; } const o=$('#scanov'); if(o) o.remove(); if(SCANMODO!=='consulta') render(); }
function leido(txt){
  const p = String(txt).split('|'), cod = (p[0]==='DS' ? p[1] : '') || '', nom = (p[0]==='DS' ? p[2] : txt) || '';
  if(SCANMODO==='consulta'){ cerrarScan(); verHistorial(nom, cod); return; }
  const U = s => String(s||'').trim().toUpperCase();
  const it = S.items.find(i => U(i.material)===U(nom) || (cod && (U(i.material).includes('('+U(cod)+')') || U(i.material)===U(cod))));
  const el = $('#scanlast') || {};
  if(!it){ el.className='scanlast bad'; el.textContent = '✕ ' + (nom||txt) + ' no está en este presupuesto'; vib([60,60,60]); return; }
  const k = S.modo==='carga' ? 'cargado' : 'devuelto';
  if(it[k]){ el.className='scanlast'; el.textContent = '✓ ' + it.material + ' ya estaba marcado'; return; }
  el.className='scanlast good'; el.textContent = '✓ ' + it.cant + ' × ' + it.material; vib(40);
  toggle(it.fila, true);
}

/* =========================================================
   SIN COBERTURA: caché de lecturas y cola de cambios
   ========================================================= */
const LECT = ['ckPresupuestos','ckMaterial','ckBolo','ckYo','ckFurgonetas','ckGastos','ckPendientes','ckAvisos','ckMantenimiento','ckReparaciones'];
function cacheGet(k){ try{ const v = localStorage.getItem('ck_c_'+k); return v ? JSON.parse(v) : undefined; }catch(e){ return undefined; } }
function cacheSet(k, v){ try{ localStorage.setItem('ck_c_'+k, JSON.stringify(v)); }catch(e){ limpiarCache(); } }
function limpiarCache(){ try{ Object.keys(localStorage).filter(k=>k.indexOf('ck_c_ckMaterial')===0||k.indexOf('ck_c_ckBolo')===0).slice(0,-6).forEach(k=>localStorage.removeItem(k)); }catch(e){} }
let COLA = []; try{ COLA = JSON.parse(localStorage.getItem('ck_cola')||'[]'); }catch(e){}
function guardarCola(){ try{ localStorage.setItem('ck_cola', JSON.stringify(COLA)); }catch(e){ toast('Memoria llena: no se pudo guardar el cambio sin conexión'); } pintarRed(); }
async function enviar(fn, ...args){
  const post = ['ckSalida','ckFirma','ckFoto','ckGasto','ckFirmaRecogida','ckExtra'].includes(fn);
  if(COLA.length){ COLA.push({fn, args, post}); guardarCola(); vaciarCola(); return null; }
  try{ return post ? await callPost(fn, ...args) : await call(fn, ...args); }
  catch(e){
    if(!e.red) throw e;
    COLA.push({fn, args, post}); guardarCola(); S.offline = true;
    toast('Sin cobertura: se enviará solo al volver la conexión');
    return null;
  }
}
let vaciando = false;
async function vaciarCola(){
  if(vaciando || !COLA.length || !navigator.onLine && navigator.onLine !== undefined && false) return;
  vaciando = true;
  try{
    while(COLA.length){
      const t = COLA[0];
      try{ t.post ? await callPost(t.fn, ...t.args) : await call(t.fn, ...t.args); }
      catch(e){ if(e.red){ S.offline = true; break; } toast('Un cambio no se pudo guardar: '+e.message); }
      COLA.shift(); guardarCola();
    }
    if(!COLA.length){ if(S.offline) toast('Conexión recuperada: todo guardado'); S.offline = false; }
  } finally { vaciando = false; pintarRed(); }
}
function pintarRed(){
  let b = $('#redbar');
  const txt = COLA.length ? `Sin conexión · ${COLA.length} cambio${COLA.length>1?'s':''} pendiente${COLA.length>1?'s':''} de enviar` : (S.offline ? 'Sin conexión · mostrando los últimos datos guardados' : '');
  if(!txt){ if(b) b.remove(); return; }
  if(!b){ b = document.createElement('div'); b.id='redbar'; b.className='redbar'; b.onclick = vaciarCola; document.body.appendChild(b); }
  b.textContent = txt;
}

/* =========================================================
   FOTOS
   ========================================================= */
function comprimir(file, lado=720, max=45000){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let L = lado, q = .7, d = '';
      for(let n=0; n<8; n++){
        const r = Math.min(1, L/Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        d = c.toDataURL('image/jpeg', q);
        if(d.length <= max) break;
        q = Math.max(.4, q-.1); L = Math.round(L*.85);
      }
      URL.revokeObjectURL(url);
      d.length <= max ? ok(d) : ko(new Error('La foto es demasiado grande'));
    };
    img.onerror = () => ko(new Error('No se pudo leer la foto'));
    img.src = url;
  });
}

/* =========================================================
   SIEMPRE LLEVAR + MATERIAL EXTRA
   ========================================================= */
function listaExtra(){
  const f = ficha(), sl = ((S.yo||{}).config||{}).siempre || [], sm = f.siempre || {};
  const c = S.modo==='dev' ? 'd' : 'c';
  const extra = (f.extra||[]).map(e => ({ tipo:'extra', nombre:e.nombre, cant:e.cant, origen:e.origen, hecho:e[c] }));
  const siempre = sl.map(s => ({ tipo:'siempre', nombre:s.nombre, cant:s.cant, hecho:(sm[s.nombre]||{})[c] }));
  return { extra, siempre };
}
function filaExtra(x){
  const id = 'x' + encodeURIComponent(x.tipo+'|'+x.nombre).replace(/[^\w]/g,'');
  return `<div class="item extra ${x.hecho?'on':''}" id="${id}" onclick='marcarExtra(${JSON.stringify(x.tipo)},${JSON.stringify(x.nombre).replace(/'/g,"&#39;")})'>
    <div class="chk">${x.hecho?'✓':''}</div><div class="qty sm">${esc(x.cant||'')}</div>
    <div class="info"><div class="mat">${esc(x.nombre)}</div><div class="meta">${x.hecho?esc(x.hecho):''}${x.tipo==='extra'&&x.origen?(x.hecho?' · ':'')+esc(x.origen):''}</div></div>
    ${x.tipo==='extra'?`<button class="more" onclick='event.stopPropagation();quitarExtra(${JSON.stringify(x.nombre).replace(/'/g,"&#39;")})' aria-label="Quitar">✕</button>`:''}</div>`;
}
function bloqueExtras(){
  if(!S.bolo) return '';
  const { extra, siempre } = listaExtra();
  const hs = siempre.filter(x=>x.hecho).length;
  return `${extra.length?`<div class="sec">Material extra (${extra.filter(x=>x.hecho).length}/${extra.length})</div>${extra.map(filaExtra).join('')}`:''}
    <button class="scan addx" onclick="abrirExtra()">＋ Añadir material extra o una plantilla</button>
    ${siempre.length?`<div class="sec sl"><span>Siempre llevar (${hs}/${siempre.length})</span>${hs<siempre.length?`<button onclick="todoExtra('siempre',true)">Marcar todo</button>`:''}</div>${siempre.map(filaExtra).join('')}`:''}`;
}
async function marcarExtra(tipo, nombre){
  const f = S.bolo.ficha, c = S.modo==='dev' ? 'd' : 'c', v = (()=>{ if(tipo==='siempre'){ f.siempre = f.siempre||{}; const o = f.siempre[nombre] = f.siempre[nombre]||{}; if(o[c]){ delete o[c]; return false; } o[c] = hora(); return true; } const o = (f.extra||[]).find(e=>e.nombre===nombre); if(!o) return false; if(o[c]){ delete o[c]; return false; } o[c] = hora(); return true; })();
  vib(v?15:[8,40,8]); guardarBoloCache(); render();
  try{ const r = await enviar('ckExtra', S.num, 'marcar', { tipo, nombre, modo:S.modo, valor:v }); if(r){ f.siempre = r.siempre; f.extra = r.extra; guardarBoloCache(); render(); } }
  catch(e){ toast('No se guardó: '+e.message); abrir(S.num, true); }
}
async function todoExtra(tipo, valor){
  const f = S.bolo.ficha, c = S.modo==='dev' ? 'd' : 'c', h = hora();
  if(tipo==='siempre'){ f.siempre = f.siempre||{}; ((S.yo.config||{}).siempre||[]).forEach(s=>{ const o = f.siempre[s.nombre] = f.siempre[s.nombre]||{}; if(valor) o[c] = o[c]||h; else delete o[c]; }); }
  guardarBoloCache(); render();
  try{ const r = await enviar('ckExtra', S.num, 'todo', { tipo, modo:S.modo, valor }); if(r){ f.siempre = r.siempre; f.extra = r.extra; guardarBoloCache(); render(); } }catch(e){ toast('No se guardó: '+e.message); }
}
async function quitarExtra(nombre){
  if(!confirm('¿Quitar "'+nombre+'" de este bolo?')) return;
  const f = S.bolo.ficha; f.extra = (f.extra||[]).filter(e=>e.nombre!==nombre); guardarBoloCache(); render();
  try{ await enviar('ckExtra', S.num, 'quitar', { nombre }); }catch(e){ toast('No se guardó: '+e.message); }
}
async function abrirExtra(){
  if(!S.plantillas){ try{ S.plantillas = await call('ckPlantillas'); }catch(e){ S.plantillas = []; } }
  if(!S.catalogo){ try{ S.catalogo = await call('ckCatalogo'); }catch(e){} }
  abrirSheet(`<h3>＋ Material extra</h3><div class="meta" style="margin-bottom:12px">Lo que no está en el presupuesto pero hay que llevar. No cambia el presupuesto ni la factura.</div>
    ${(S.plantillas||[]).length?`<div class="fld"><span>Aplicar una plantilla</span></div>${S.plantillas.map(p=>`<button class="mitem" onclick="aplicarPlantilla('${esc(p.id)}')"><span class="ic">📋</span><span><b>${esc(p.nombre)}</b><small>${p.items.length} ${p.items.length===1?'cosa':'cosas'} · ${esc(p.origen||'')}</small></span></button>`).join('')}`:''}
    <div class="fld" style="margin-top:14px"><span>O añade una cosa</span></div>
    <div class="row2"><input id="exN" list="exL" placeholder="Material" autocomplete="off" class="inp"><input id="exC" inputmode="numeric" placeholder="Cantidad" class="inp"></div>
    <datalist id="exL">${(S.catalogo||[]).map(x=>`<option value="${esc(x.nombre)}">`).join('')}</datalist>
    <div class="row2" style="margin-top:12px"><button class="btn sec2" onclick="cerrarSheet()">Cerrar</button><button class="btn" onclick="anadirExtra()">Añadir</button></div>`);
}

async function fotosMontaje(inp){

  for(const f of fs){
    try{ const d = await comprimir(f, 900, 45000); S.fotos.push({ fecha: hora(), material:'Montaje', tipo:'montaje', img:d }); render(); await enviar('ckFoto', S.num, 'Montaje', 'montaje', d); }
    catch(e){ toast(e.message); }
  }
  toast(fs.length>1 ? fs.length+' fotos guardadas' : 'Foto guardada');
}

/* =========================================================
   DOSSIER Y PDF
   ========================================================= */
function descargarPdf(r){
  const bin = atob(r.b64), arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  const url = URL.createObjectURL(new Blob([arr], { type:'application/pdf' }));
  const a = document.createElement('a'); a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function dossier(enviarCorreo){
  cerrarSheet(); toast('Preparando el dossier…');
  try{ const r = await call('ckDossier', S.num, !!enviarCorreo); descargarPdf(r); toast(enviarCorreo ? 'Dossier descargado y enviado a tu correo' : 'Dossier descargado'); }
  catch(e){ toast(e.red?'Necesitas conexión':'Error: '+e.message); }
}

else arrancar();
